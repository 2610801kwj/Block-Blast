<body>

    <div id="homeScreen">
        <h1>🧱 BLOCK BLAST</h1>
        <button class="main-btn" onclick="startGame()">PLAY GAME</button>
    </div>

    <div id="comboText">GREAT!</div>

    <div class="score-container">
        <div class="score-box">SCORE<br><span id="currentScore" class="score-val">0</span></div>
        <div class="score-box">BEST<br><span id="bestScore" class="score-val">0</span></div>
    </div>
    
    <div id="board"></div>
    <div class="divider"></div>
    <div id="rack"></div>

    <div id="gameOverModal">
        <div class="modal-content">
            <h2>GAME OVER</h2>
            <p>더 이상 블록을 놓을 공간이 없습니다!</p>
            <div class="modal-btn-group">
                <button class="modal-btn btn-replay" onclick="resetGame()">REPLAY</button>
                <button class="modal-btn btn-home" onclick="goHome()">HOME</button>
            </div>
        </div>
    </div>

    <script>
        const boardEl = document.getElementById('board');
        const rackEl = document.getElementById('rack');
        const currentScoreEl = document.getElementById('currentScore');
        const bestScoreEl = document.getElementById('bestScore');
        const gameOverModal = document.getElementById('gameOverModal');
        const homeScreen = document.getElementById('homeScreen');
        const comboTextEl = document.getElementById('comboText');

        const ROWS = 8, COLS = 8;
        let boardState = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
        
        let score = 0;
        let bestScore = 0;
        let activeBlock = null;
        let rackSlots = [null, null, null];
        let comboCount = 0;

        // 드래그 중 정밀한 위치 파악을 위한 오프셋 변수
        let dragOffsetX = 0;
        let dragOffsetY = 0;

        const themes = [
            { bg: '#141419', border: '#444', cell: '#25252e' },
            { bg: '#0b0f19', border: '#1e293b', cell: '#1e293b' },
            { bg: '#0a1410', border: '#102a1e', cell: '#143527' }
        ];
        let currentCellColor = '#25252e';

        function applyRandomTheme() {
            const randomTheme = themes[Math.floor(Math.random() * themes.length)];
            document.body.style.background = randomTheme.bg;
            boardEl.style.background = randomTheme.bg;
            boardEl.style.borderColor = randomTheme.border;
            currentCellColor = randomTheme.cell;
            
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (boardState[r][c] === 0) {
                        boardEl.children[r * COLS + c].style.backgroundColor = currentCellColor;
                    }
                }
            }
        }

        // 격자판 초기 생성
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.dataset.row = r;
                cell.dataset.col = c;
                boardEl.appendChild(cell);
            }
        }

        const blockPool = [
            { shape: [[1]], color: '#9c27b0', rows: 1, cols: 1 },
            { shape: [[1, 1], [1, 1]], color: '#00bcd4', rows: 2, cols: 2 },
            { shape: [[1, 1, 1], [1, 1, 1], [1, 1, 1]], color: '#4caf50', rows: 3, cols: 3 },
            { shape: [[1, 1, 1]], color: '#e91e63', rows: 1, cols: 3 },
            { shape: [[1], [1], [1]], color: '#e91e63', rows: 3, cols: 1 },
            { shape: [[1, 0], [1, 0], [1, 1]], color: '#ff9800', rows: 3, cols: 2 },
            { shape: [[1, 1, 1], [0, 1, 0]], color: '#ffeb3b', rows: 2, cols: 3 },
            { shape: [[1, 1], [0, 1]], color: '#03a9f4', rows: 2, cols: 2 },
            { shape: [[1, 1, 1, 1]], color: '#3f51b5', rows: 1, cols: 4 }
        ];

        function startGame() {
            homeScreen.style.display = 'none';
            applyRandomTheme();
            resetGame();
        }

        function goHome() {
            gameOverModal.style.display = 'none';
            homeScreen.style.display = 'flex';
        }

        function spawnBlocks() {
            for (let i = 0; i < 3; i++) {
                const randIndex = Math.floor(Math.random() * blockPool.length);
                rackSlots[i] = blockPool[randIndex];
            }
            renderRack();
            checkGameOver();
        }

        function renderRack() {
            rackEl.innerHTML = '';
            rackSlots.forEach((block, slotIndex) => {
                if (!block) {
                    const emptyBox = document.createElement('div');
                    emptyBox.style.width = '80px';
                    rackEl.appendChild(emptyBox);
                    return;
                }

                const box = document.createElement('div');
                box.className = 'block-container';
                box.style.gridTemplateRows = `repeat(${block.rows}, 27px)`;
                box.style.gridTemplateColumns = `repeat(${block.cols}, 27px)`;
                box.dataset.slotIndex = slotIndex;

                for (let r = 0; r < block.rows; r++) {
                    for (let c = 0; c < block.cols; c++) {
                        const tile = document.createElement('div');
                        tile.className = 'tile';
                        if (block.shape[r][c] === 1) {
                            tile.style.backgroundColor = block.color;
                        } else {
                            tile.style.backgroundColor = 'transparent';
                        }
                        box.appendChild(tile);
                    }
                }

                box.addEventListener('touchstart', handleTouchStart, { passive: false });
                box.addEventListener('touchmove', handleTouchMove, { passive: false });
                box.addEventListener('touchend', handleTouchEnd, { passive: false });
                box.addEventListener('mousedown', handleMouseDown);

                rackEl.appendChild(box);
            });
        }

        // 프리뷰 스타일 초기화 및 빛남 클래스 정리
        function clearPreview() {
            for (let i = 0; i < boardEl.children.length; i++) {
                const cell = boardEl.children[i];
                const r = parseInt(cell.dataset.row);
                const c = parseInt(cell.dataset.col);
                if (boardState[r][c] === 0) {
                    cell.style.backgroundColor = currentCellColor;
                    cell.style.opacity = '1';
                }
                cell.classList.remove('glow-blast');
            }
        }

        // [핵심 변경] 사용자가 선택한 실제 타일 칸을 조작의 타겟 기준으로 산출
        function updatePreview(clientX, clientY, slotIndex) {
            clearPreview();
            
            // 현재 손가락/마우스가 위치한 정중앙의 타일 요소를 추적
            const target = document.elementFromPoint(clientX, clientY);
            if (!target || !target.classList.contains('cell')) return;

            const startRow = parseInt(target.dataset.row);
            const startCol = parseInt(target.dataset.col);
            const block = rackSlots[slotIndex];
            if (!block) return;

            // 보드판 위에 놓기가 유효한 경우 프리뷰 가상 연산 가동
            if (canBlockFit(startRow, startCol, block)) {
                // 임시 가상 보드판 복사 생성
                let virtualBoard = boardState.map(row => [...row]);

                for (let r = 0; r < block.rows; r++) {
                    for (let c = 0; c < block.cols; c++) {
                        if (block.shape[r][c] === 1) {
                            const cell = boardEl.children[(startRow + r) * COLS + (startCol + c)];
                            cell.style.backgroundColor = block.color;
                            cell.style.opacity = '0.5'; 
                            virtualBoard[startRow + r][startCol + c] = block.color; // 가상 배치
                        }
                    }
                }

                // [추가 기능] 놓으면 지워질 예정인 행/열 사전 검출 및 프리뷰 빛남(블러) 연출 적용
                let predictRows = [];
                let predictCols = [];

                for (let r = 0; r < ROWS; r++) {
                    if (virtualBoard[r].every(cell => cell !== 0)) predictRows.push(r);
                }
                for (let c = 0; c < COLS; c++) {
                    let colFull = true;
                    for (let r = 0; r < ROWS; r++) {
                        if (virtualBoard[r][c] === 0) { colFull = false; break; }
                    }
                    if (colFull) predictCols.push(c);
                }

                // 지워질 예정인 줄 전체를 하이라이팅 네온사인으로 빛나게 처리
                predictRows.forEach(r => {
                    for(let c = 0; c < COLS; c++) {
                        const cell = boardEl.children[r * COLS + c];
                        cell.style.color = virtualBoard[r][c] || '#fff';
                        cell.classList.add('glow-blast');
                    }
                });
                predictCols.forEach(c => {
                    for(let r = 0; r < ROWS; r++) {
                        const cell = boardEl.children[r * COLS + c];
                        cell.style.color = virtualBoard[r][c] || '#fff';
                        cell.classList.add('glow-blast');
                    }
                });
            }
        }

        function canBlockFit(startRow, startCol, block) {
            if (startRow + block.rows > ROWS || startCol + block.cols > COLS) return false;
            for (let r = 0; r < block.rows; r++) {
                for (let c = 0; c < block.cols; c++) {
                    if (block.shape[r][c] === 1 && boardState[startRow + r][startCol + c] !== 0) {
                        return false;
                    }
                }
            }
            return true;
        }

        function checkGameOver() {
            const availableBlocks = rackSlots.filter(b => b !== null);
            if (availableBlocks.length === 0) return;

            for (let block of availableBlocks) {
                for (let r = 0; r < ROWS; r++) {
                    for (let c = 0; c < COLS; c++) {
                        if (canBlockFit(r, c, block)) return;
                    }
                }
            }
            gameOverModal.style.display = 'flex';
        }

        function resetGame() {
            score = 0;
            comboCount = 0;
            currentScoreEl.textContent = '0';
            boardState = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
            clearPreview();
            gameOverModal.style.display = 'none';
            spawnBlocks();
        }

        // [조작감 개선] 터치 다운 시 터치한 상대적 좌표(오프셋)를 정확히 연산하여 껌딱지처럼 밀착 유지
        function handleTouchStart(e) {
            e.preventDefault(); 
            activeBlock = this; 
            const touch = e.touches[0];
            const rect = activeBlock.getBoundingClientRect();
            
            // 유저가 실제 클릭한 내부의 상대 지점 계산
            dragOffsetX = touch.clientX - rect.left;
            dragOffsetY = touch.clientY - rect.top;

            activeBlock.style.position = 'fixed'; 
            activeBlock.style.zIndex = '1000';
            activeBlock.style.transform = 'scale(1.1)'; 
            activeBlock.style.pointerEvents = 'none';

            moveBlock(touch.clientX, touch.clientY);
            updatePreview(touch.clientX, touch.clientY, activeBlock.dataset.slotIndex);
        }

        function handleTouchMove(e) {
            if (!activeBlock) return; 
            e.preventDefault(); 
            const touch = e.touches[0];
            moveBlock(touch.clientX, touch.clientY); 
            updatePreview(touch.clientX, touch.clientY, activeBlock.dataset.slotIndex);
        }

        function handleTouchEnd(e) {
            if (!activeBlock) return; 
            const touch = e.changedTouches[0];
            const target = document.elementFromPoint(touch.clientX, touch.clientY);
            
            clearPreview(); 
            activeBlock.style.transform = 'none'; 
            activeBlock.style.pointerEvents = 'auto';
            processPlacement(target);
        }

        // [마우스 대응] 마우스 다운 시 오프셋 값 정밀 세팅
        function handleMouseDown(e) {
            mouseDragBlock = this;
            const rect = mouseDragBlock.getBoundingClientRect();
            
            dragOffsetX = e.clientX - rect.left;
            dragOffsetY = e.clientY - rect.top;

            mouseDragBlock.style.position = 'fixed'; 
            mouseDragBlock.style.zIndex = '1000'; 
            mouseDragBlock.style.transform = 'scale(1.1)';
            mouseDragBlock.style.pointerEvents = 'none';
            
            // 최초 드래그 위치 보정
            mouseDragBlock.style.left = `${e.clientX - dragOffsetX}px`;
            mouseDragBlock.style.top = `${e.clientY - dragOffsetY}px`;

            const moveHandler = (ev) => {
                mouseDragBlock.style.left = `${ev.clientX - dragOffsetX}px`;
                mouseDragBlock.style.top = `${ev.clientY - dragOffsetY}px`;
                updatePreview(ev.clientX, ev.clientY, mouseDragBlock.dataset.slotIndex);
            };

            const upHandler = (ev) => {
                window.removeEventListener('mousemove', moveHandler); 
                window.removeEventListener('mouseup', upHandler);
                const target = document.elementFromPoint(ev.clientX, ev.clientY); 
                clearPreview();
                activeBlock = mouseDragBlock; 
                activeBlock.style.transform = 'none';
                activeBlock.style.pointerEvents = 'auto';
                processPlacement(target); 
                mouseDragBlock = null;
            };
            window.addEventListener('mousemove', moveHandler); 
            window.addEventListener('mouseup', upHandler);
        }

        function moveBlock(clientX, clientY) {
            activeBlock.style.left = `${clientX - dragOffsetX}px`; 
            activeBlock.style.top = `${clientY - dragOffsetY}px`;
        }

        function createExplosion(cellEl, color) {
            const rect = cellEl.getBoundingClientRect();
            for (let i = 0; i < 6; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle'; particle.style.backgroundColor = color;
                particle.style.left = `${rect.left + rect.width / 2}px`; particle.style.top = `${rect.top + rect.height / 2}px`;
                const angle = Math.random() * Math.PI * 2; const distance = Math.random() * 50 + 30;
                particle.style.setProperty('--dx', `${Math.cos(angle) * distance}px`);
                particle.style.setProperty('--dy', `${Math.sin(angle) * distance}px`);
                document.body.appendChild(particle); setTimeout(() => particle.remove(), 500);
            }
        }

        function showComboReaction(combo) {
            let text = "GREAT!";
            let color = "#ffeb3b"; 
            if (combo === 2) { text = "EXCELLENT!!"; color = "#00e676"; }
            else if (combo === 3) { text = "AMAZING!!!"; color = "#00b0ff"; }
            else if (combo >= 4) { text = "UNBELIEVABLE!!!!"; color = "#d500f9"; }

            comboTextEl.textContent = text;
            comboTextEl.style.textShadow = `0 0 15px ${color}, 0 0 30px ${color}`;
            comboTextEl.className = ''; 
            void comboTextEl.offsetWidth; 
            comboTextEl.className = 'combo-animate';
        }

        async function playAllClearAnimation() {
            const colors = ['#e91e63', '#00bcd4', '#ffeb3b', '#4caf50', '#ff9800', '#9c27b0', '#03a9f4', '#3f51b5'];
            
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const cell = boardEl.children[r * COLS + c];
                    cell.style.backgroundColor = colors[r];
                    cell.style.color = colors[r];
                    cell.classList.add('glow-blast');
                }
                await new Promise(resolve => setTimeout(resolve, 50));
            }

            await new Promise(resolve => setTimeout(resolve, 150));

            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const cell = boardEl.children[r * COLS + c];
                    createExplosion(cell, colors[r]);
                }
            }

            boardState = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
            applyRandomTheme(); 
            clearPreview();
            
            addScore(1000); 
            showComboReaction(4); 
        }

        function processPlacement(target) {
            let placed = false;
            if (!activeBlock) return;
            const slotIndex = parseInt(activeBlock.dataset.slotIndex);
            const block = rackSlots[slotIndex];

            if (target && target.classList.contains('cell') && block) {
                const startRow = parseInt(target.dataset.row);
                const startCol = parseInt(target.dataset.col);

                if (canBlockFit(startRow, startCol, block)) {
                    let tileCount = 0;
                    for (let r = 0; r < block.rows; r++) {
                        for (let c = 0; c < block.cols; c++) {
                            if (block.shape[r][c] === 1) {
                                boardState[startRow + r][startCol + c] = block.color;
                                const targetCell = boardEl.children[(startRow + r) * COLS + (startCol + c)];
                                targetCell.style.backgroundColor = block.color;
                                tileCount++;
                            }
                        }
                    }
                    
                    addScore(tileCount * 10);
                    checkAndBlast();
                    
                    rackSlots[slotIndex] = null;
                    placed = true;
                }
            }

            activeBlock.style.position = 'relative'; activeBlock.style.left = '0px'; activeBlock.style.top = '0px'; activeBlock.style.zIndex = '10'; activeBlock = null;

            if (placed) {
                if (rackSlots.every(slot => slot === null)) {
                    spawnBlocks();
                } else {
                    renderRack();
                    checkGameOver();
                }
            } else {
                renderRack();
            }
        }

        function addScore(amount) {
            score += amount; currentScoreEl.textContent = score;
            if (score > bestScore) { bestScore = score; bestScoreEl.textContent = bestScore; }
        }

        function checkAndBlast() {
            let rowsToBlast = [];
            let colsToBlast = [];

            for (let r = 0; r < ROWS; r++) {
                if (boardState[r].every(cell => cell !== 0)) rowsToBlast.push(r);
            }
            for (let c = 0; c < COLS; c++) {
                let colFull = true;
                for (let r = 0; r < ROWS; r++) {
                    if (boardState[r][c] === 0) { colFull = false; break; }
                }
                if (colFull) colsToBlast.push(c);
            }

            const linesBlasted = rowsToBlast.length + colsToBlast.length;
            
            if (linesBlasted > 0) {
                comboCount++; 
                addScore(linesBlasted * 150 * comboCount); 
                showComboReaction(comboCount); 

                rowsToBlast.forEach(r => {
                    for(let c = 0; c < COLS; c++) {
                        const cell = boardEl.children[r * COLS + c];
                        cell.style.color = boardState[r][c];
                        cell.classList.add('glow-blast');
                    }
                });
                colsToBlast.forEach(c => {
                    for(let r = 0; r < ROWS; r++) {
                        const cell = boardEl.children[r * COLS + c];
                        cell.style.color = boardState[r][c];
                        cell.classList.add('glow-blast');
                    }
                });

                setTimeout(() => {
                    rowsToBlast.forEach(r => {
                        for(let c = 0; c < COLS; c++) {
                            createExplosion(boardEl.children[r * COLS + c], boardState[r][c]);
                        }
                    });
                    colsToBlast.forEach(c => {
                        for (let r = 0; r < ROWS; r++) {
                            if (boardState[r][c] !== 0 && !rowsToBlast.includes(r)) {
                                createExplosion(boardEl.children[r * COLS + c], boardState[r][c]);
                            }
                        }
                    });

                    rowsToBlast.forEach(r => {
                        boardState[r].fill(0);
                        for(let c=0; c<COLS; c++) {
                            const cell = boardEl.children[r * COLS + c];
                            cell.style.backgroundColor = currentCellColor;
                            cell.classList.remove('glow-blast');
                        }
                    });
                    colsToBlast.forEach(c => {
                        for (let r = 0; r < ROWS; r++) {
                            boardState[r][c] = 0;
                            const cell = boardEl.children[r * COLS + c];
                            cell.style.backgroundColor = currentCellColor;
                            cell.classList.remove('glow-blast');
                        }
                    });

                    let isAllClear = true;
                    for (let r = 0; r < ROWS; r++) {
                        for (let c = 0; c < COLS; c++) {
                            if (boardState[r][c] !== 0) { isAllClear = false; break; }
                        }
                    }
                    if (isAllClear) {
                        playAllClearAnimation(); 
                    }

                }, 200);

            } else {
                comboCount = 0; 
            }
        }
    </script>
</body>
</html>
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>블록 블라스터 마스터피스</title>
    <style>
        body {
            background: #141419; color: #fff; font-family: 'Segoe UI', sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; margin: 0; user-select: none; touch-action: none;
            transition: background 0.5s ease;
        }
        
        #homeScreen {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #141419; z-index: 6000;
        }
        #homeScreen h1 {
            font-size: 3rem; color: #ffeb3b; margin-bottom: 40px;
            text-shadow: 0 0 20px rgba(255,235,59,0.5);
            animation: pulse 2s infinite alternate;
        }
        .main-btn {
            background: #4caf50; color: #fff; border: none; padding: 16px 45px; 
            font-size: 1.4rem; font-weight: bold; border-radius: 8px; cursor: pointer;
            box-shadow: 0 5px 15px rgba(76,175,80,0.4); transition: 0.2s;
        }
        .main-btn:active { transform: scale(0.95); }

        @keyframes pulse { 0% { transform: scale(1); } 100% { transform: scale(1.05); } }

        .score-container { display: flex; gap: 40px; margin-bottom: 10px; font-size: 1.2rem; font-weight: bold; }
        .score-box { text-align: center; }
        .score-val { color: #ffeb3b; font-size: 1.6rem; text-shadow: 0 0 15px rgba(255,235,59,0.4); }

        /* 8x8 메인 게임판 */
        #board {
            display: grid; grid-template-columns: repeat(8, 42px); grid-template-rows: repeat(8, 42px); gap: 2px;
            background: #141419; padding: 6px; border: 4px solid #444; border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); position: relative; transition: all 0.5s ease;
        }
        .cell { 
            background: #25252e; border-radius: 4px; box-sizing: border-box; 
            position: relative; transition: background 0.1s ease, filter 0.1s ease;
        }

        /* [이펙트] 줄 소거 대기/실행 시 강렬한 네온 빛과 블러 처리 */
        .cell.glow-blast {
            filter: blur(1px) brightness(1.8);
            box-shadow: 0 0 15px currentColor, inset 0 0 8px currentColor;
            z-index: 50;
        }

        .divider { width: 350px; height: 1px; background: #333; margin: 25px 0; }
        #rack { display: flex; gap: 30px; justify-content: center; align-items: center; width: 350px; height: 100px; position: relative; }
        .block-container { display: grid; gap: 1px; position: relative; touch-action: none; z-index: 10; cursor: grab; }
        .block-container:active { cursor: grabbing; }
        .tile { border-radius: 3px; width: 26px; height: 26px; }

        /* 이펙트 파티클 */
        .particle {
            position: fixed; width: 8px; height: 8px; border-radius: 2px;
            pointer-events: none; z-index: 2000; animation: explode 0.5s ease-out forwards;
        }
        @keyframes explode {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
        }

        /* 콤보 발생 시 중앙에 튀어나오는 영어 문구 컴포넌트 */
        #comboText {
            position: fixed; font-size: 2.5rem; font-weight: 900; color: #fff;
            text-shadow: 0 0 15px #ff1744, 0 0 30px #ff1744; pointer-events: none;
            z-index: 4000; opacity: 0; transform: scale(0.3); text-align: center;
        }
        .combo-animate { animation: popText 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

        @keyframes popText {
            0% { opacity: 0; transform: scale(0.3) rotate(-5deg); }
            30% { opacity: 1; transform: scale(1.1) rotate(5deg); }
            50% { transform: scale(1) rotate(0deg); }
            80% { opacity: 1; transform: translateY(-30px) scale(1); }
            100% { opacity: 0; transform: translateY(-50px) scale(0.8); }
        }

        /* 게임 오버 모달 */
        #gameOverModal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); z-index: 5000; flex-direction: column; align-items: center; justify-content: center;
        }
        .modal-content {
            background: #22222b; padding: 35px 40px; border-radius: 12px; text-align: center;
            border: 3px solid #ff5722; box-shadow: 0 0 20px rgba(255,87,34,0.4);
        }
        .modal-content h2 { color: #ff5722; margin: 0 0 10px 0; font-size: 2.2rem; }
        .modal-content p { font-size: 1.1rem; margin: 10px 0 25px 0; color: #ccc; }
        .modal-btn-group { display: flex; gap: 15px; justify-content: center; }
        .modal-btn {
            color: #fff; border: none; padding: 12px 24px; font-size: 1.1rem; font-weight: bold;
            border-radius: 6px; cursor: pointer; transition: 0.2s; min-width: 110px;
        }
        .btn-replay { background: #ff5722; }
        .btn-home { background: #555; }
    </style>
</head>
<body>

    <div id="homeScreen">
        <h1>🧱 BLOCK BLAST</h1>
        <button class="main-btn" onclick="startGame()">PLAY GAME</button>
    </div>

    <div id="comboText">GREAT!</div>

    <div class="score-container">
        <div class="score-box">SCORE<br><span id="currentScore" class="score-val">0</span></div>
        <div class="score-box">BEST<br><span id="bestScore" class="score-val">0</span></div>
    </div>
    
    <div id="board"></div>
    <div class="divider"></div>
    <div id="rack"></div>

    <div id="gameOverModal">
        <div class="modal-content">
            <h2>GAME OVER</h2>
            <p>더 이상 블록을 놓을 공간이 없습니다!</p>
            <div class="modal-btn-group">
                <button class="modal-btn btn-replay" onclick="resetGame()">REPLAY</button>
                <button class="modal-btn btn-home" onclick="goHome()">HOME</button>
            </div>
        </div>
    </div>

    <script>
        const boardEl = document.getElementById('board');
        const rackEl = document.getElementById('rack');
        const currentScoreEl = document.getElementById('currentScore');
        const bestScoreEl = document.getElementById('bestScore');
        const gameOverModal = document.getElementById('gameOverModal');
        const homeScreen = document.getElementById('homeScreen');
        const comboTextEl = document.getElementById('comboText');

        const ROWS = 8, COLS = 8;
        let boardState = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
        
        let score = 0;
        let bestScore = 0;
        let activeBlock = null;
        let rackSlots = [null, null, null];
        let comboCount = 0;

        // 드래그 중 정밀한 위치 파악을 위한 오프셋 변수
        let dragOffsetX = 0;
        let dragOffsetY = 0;

        const themes = [
            { bg: '#141419', border: '#444', cell: '#25252e' },
            { bg: '#0b0f19', border: '#1e293b', cell: '#1e293b' },
            { bg: '#0a1410', border: '#102a1e', cell: '#143527' }
        ];
        let currentCellColor = '#25252e';

        function applyRandomTheme() {
            const randomTheme = themes[Math.floor(Math.random() * themes.length)];
            document.body.style.background = randomTheme.bg;
            boardEl.style.background = randomTheme.bg;
            boardEl.style.borderColor = randomTheme.border;
            currentCellColor = randomTheme.cell;
            
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (boardState[r][c] === 0) {
                        boardEl.children[r * COLS + c].style.backgroundColor = currentCellColor;
                    }
                }
            }
        }

        // 격자판 초기 생성
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.dataset.row = r;
                cell.dataset.col = c;
                boardEl.appendChild(cell);
            }
        }

        const blockPool = [
            { shape: [[1]], color: '#9c27b0', rows: 1, cols: 1 },
            { shape: [[1, 1], [1, 1]], color: '#00bcd4', rows: 2, cols: 2 },
            { shape: [[1, 1, 1], [1, 1, 1], [1, 1, 1]], color: '#4caf50', rows: 3, cols: 3 },
            { shape: [[1, 1, 1]], color: '#e91e63', rows: 1, cols: 3 },
            { shape: [[1], [1], [1]], color: '#e91e63', rows: 3, cols: 1 },
            { shape: [[1, 0], [1, 0], [1, 1]], color: '#ff9800', rows: 3, cols: 2 },
            { shape: [[1, 1, 1], [0, 1, 0]], color: '#ffeb3b', rows: 2, cols: 3 },
            { shape: [[1, 1], [0, 1]], color: '#03a9f4', rows: 2, cols: 2 },
            { shape: [[1, 1, 1, 1]], color: '#3f51b5', rows: 1, cols: 4 }
        ];

        function startGame() {
            homeScreen.style.display = 'none';
            applyRandomTheme();
            resetGame();
        }

        function goHome() {
            gameOverModal.style.display = 'none';
            homeScreen.style.display = 'flex';
        }

        function spawnBlocks() {
            for (let i = 0; i < 3; i++) {
                const randIndex = Math.floor(Math.random() * blockPool.length);
                rackSlots[i] = blockPool[randIndex];
            }
            renderRack();
            checkGameOver();
        }

        function renderRack() {
            rackEl.innerHTML = '';
            rackSlots.forEach((block, slotIndex) => {
                if (!block) {
                    const emptyBox = document.createElement('div');
                    emptyBox.style.width = '80px';
                    rackEl.appendChild(emptyBox);
                    return;
                }

                const box = document.createElement('div');
                box.className = 'block-container';
                box.style.gridTemplateRows = `repeat(${block.rows}, 27px)`;
                box.style.gridTemplateColumns = `repeat(${block.cols}, 27px)`;
                box.dataset.slotIndex = slotIndex;

                for (let r = 0; r < block.rows; r++) {
                    for (let c = 0; c < block.cols; c++) {
                        const tile = document.createElement('div');
                        tile.className = 'tile';
                        if (block.shape[r][c] === 1) {
                            tile.style.backgroundColor = block.color;
                        } else {
                            tile.style.backgroundColor = 'transparent';
                        }
                        box.appendChild(tile);
                    }
                }

                box.addEventListener('touchstart', handleTouchStart, { passive: false });
                box.addEventListener('touchmove', handleTouchMove, { passive: false });
                box.addEventListener('touchend', handleTouchEnd, { passive: false });
                box.addEventListener('mousedown', handleMouseDown);

                rackEl.appendChild(box);
            });
        }

        // 프리뷰 스타일 초기화 및 빛남 클래스 정리
        function clearPreview() {
            for (let i = 0; i < boardEl.children.length; i++) {
                const cell = boardEl.children[i];
                const r = parseInt(cell.dataset.row);
                const c = parseInt(cell.dataset.col);
                if (boardState[r][c] === 0) {
                    cell.style.backgroundColor = currentCellColor;
                    cell.style.opacity = '1';
                }
                cell.classList.remove('glow-blast');
            }
        }

        // [핵심 변경] 사용자가 선택한 실제 타일 칸을 조작의 타겟 기준으로 산출
        function updatePreview(clientX, clientY, slotIndex) {
            clearPreview();
            
            // 현재 손가락/마우스가 위치한 정중앙의 타일 요소를 추적
            const target = document.elementFromPoint(clientX, clientY);
            if (!target || !target.classList.contains('cell')) return;

            const startRow = parseInt(target.dataset.row);
            const startCol = parseInt(target.dataset.col);
            const block = rackSlots[slotIndex];
            if (!block) return;

            // 보드판 위에 놓기가 유효한 경우 프리뷰 가상 연산 가동
            if (canBlockFit(startRow, startCol, block)) {
                // 임시 가상 보드판 복사 생성
                let virtualBoard = boardState.map(row => [...row]);

                for (let r = 0; r < block.rows; r++) {
                    for (let c = 0; c < block.cols; c++) {
                        if (block.shape[r][c] === 1) {
                            const cell = boardEl.children[(startRow + r) * COLS + (startCol + c)];
                            cell.style.backgroundColor = block.color;
                            cell.style.opacity = '0.5'; 
                            virtualBoard[startRow + r][startCol + c] = block.color; // 가상 배치
                        }
                    }
                }

                // [추가 기능] 놓으면 지워질 예정인 행/열 사전 검출 및 프리뷰 빛남(블러) 연출 적용
                let predictRows = [];
                let predictCols = [];

                for (let r = 0; r < ROWS; r++) {
                    if (virtualBoard[r].every(cell => cell !== 0)) predictRows.push(r);
                }
                for (let c = 0; c < COLS; c++) {
                    let colFull = true;
                    for (let r = 0; r < ROWS; r++) {
                        if (virtualBoard[r][c] === 0) { colFull = false; break; }
                    }
                    if (colFull) predictCols.push(c);
                }

                // 지워질 예정인 줄 전체를 하이라이팅 네온사인으로 빛나게 처리
                predictRows.forEach(r => {
                    for(let c = 0; c < COLS; c++) {
                        const cell = boardEl.children[r * COLS + c];
                        cell.style.color = virtualBoard[r][c] || '#fff';
                        cell.classList.add('glow-blast');
                    }
                });
                predictCols.forEach(c => {
                    for(let r = 0; r < ROWS; r++) {
                        const cell = boardEl.children[r * COLS + c];
                        cell.style.color = virtualBoard[r][c] || '#fff';
                        cell.classList.add('glow-blast');
                    }
                });
            }
        }

        function canBlockFit(startRow, startCol, block) {
            if (startRow + block.rows > ROWS || startCol + block.cols > COLS) return false;
            for (let r = 0; r < block.rows; r++) {
                for (let c = 0; c < block.cols; c++) {
                    if (block.shape[r][c] === 1 && boardState[startRow + r][startCol + c] !== 0) {
                        return false;
                    }
                }
            }
            return true;
        }

        function checkGameOver() {
            const availableBlocks = rackSlots.filter(b => b !== null);
            if (availableBlocks.length === 0) return;

            for (let block of availableBlocks) {
                for (let r = 0; r < ROWS; r++) {
                    for (let c = 0; c < COLS; c++) {
                        if (canBlockFit(r, c, block)) return;
                    }
                }
            }
            gameOverModal.style.display = 'flex';
        }

        function resetGame() {
            score = 0;
            comboCount = 0;
            currentScoreEl.textContent = '0';
            boardState = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
            clearPreview();
            gameOverModal.style.display = 'none';
            spawnBlocks();
        }

        // [조작감 개선] 터치 다운 시 터치한 상대적 좌표(오프셋)를 정확히 연산하여 껌딱지처럼 밀착 유지
        function handleTouchStart(e) {
            e.preventDefault(); 
            activeBlock = this; 
            const touch = e.touches[0];
            const rect = activeBlock.getBoundingClientRect();
            
            // 유저가 실제 클릭한 내부의 상대 지점 계산
            dragOffsetX = touch.clientX - rect.left;
            dragOffsetY = touch.clientY - rect.top;

            activeBlock.style.position = 'fixed'; 
            activeBlock.style.zIndex = '1000';
            activeBlock.style.transform = 'scale(1.1)'; 
            activeBlock.style.pointerEvents = 'none';

            moveBlock(touch.clientX, touch.clientY);
            updatePreview(touch.clientX, touch.clientY, activeBlock.dataset.slotIndex);
        }

        function handleTouchMove(e) {
            if (!activeBlock) return; 
            e.preventDefault(); 
            const touch = e.touches[0];
            moveBlock(touch.clientX, touch.clientY); 
            updatePreview(touch.clientX, touch.clientY, activeBlock.dataset.slotIndex);
        }

        function handleTouchEnd(e) {
            if (!activeBlock) return; 
            const touch = e.changedTouches[0];
            const target = document.elementFromPoint(touch.clientX, touch.clientY);
            
            clearPreview(); 
            activeBlock.style.transform = 'none'; 
            activeBlock.style.pointerEvents = 'auto';
            processPlacement(target);
        }

        // [마우스 대응] 마우스 다운 시 오프셋 값 정밀 세팅
        function handleMouseDown(e) {
            mouseDragBlock = this;
            const rect = mouseDragBlock.getBoundingClientRect();
            
            dragOffsetX = e.clientX - rect.left;
            dragOffsetY = e.clientY - rect.top;

            mouseDragBlock.style.position = 'fixed'; 
            mouseDragBlock.style.zIndex = '1000'; 
            mouseDragBlock.style.transform = 'scale(1.1)';
            mouseDragBlock.style.pointerEvents = 'none';
            
            // 최초 드래그 위치 보정
            mouseDragBlock.style.left = `${e.clientX - dragOffsetX}px`;
            mouseDragBlock.style.top = `${e.clientY - dragOffsetY}px`;

            const moveHandler = (ev) => {
                mouseDragBlock.style.left = `${ev.clientX - dragOffsetX}px`;
                mouseDragBlock.style.top = `${ev.clientY - dragOffsetY}px`;
                updatePreview(ev.clientX, ev.clientY, mouseDragBlock.dataset.slotIndex);
            };

            const upHandler = (ev) => {
                window.removeEventListener('mousemove', moveHandler); 
                window.removeEventListener('mouseup', upHandler);
                const target = document.elementFromPoint(ev.clientX, ev.clientY); 
                clearPreview();
                activeBlock = mouseDragBlock; 
                activeBlock.style.transform = 'none';
                activeBlock.style.pointerEvents = 'auto';
                processPlacement(target); 
                mouseDragBlock = null;
            };
            window.addEventListener('mousemove', moveHandler); 
            window.addEventListener('mouseup', upHandler);
        }

        function moveBlock(clientX, clientY) {
            activeBlock.style.left = `${clientX - dragOffsetX}px`; 
            activeBlock.style.top = `${clientY - dragOffsetY}px`;
        }

        function createExplosion(cellEl, color) {
            const rect = cellEl.getBoundingClientRect();
            for (let i = 0; i < 6; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle'; particle.style.backgroundColor = color;
                particle.style.left = `${rect.left + rect.width / 2}px`; particle.style.top = `${rect.top + rect.height / 2}px`;
                const angle = Math.random() * Math.PI * 2; const distance = Math.random() * 50 + 30;
                particle.style.setProperty('--dx', `${Math.cos(angle) * distance}px`);
                particle.style.setProperty('--dy', `${Math.sin(angle) * distance}px`);
                document.body.appendChild(particle); setTimeout(() => particle.remove(), 500);
            }
        }

        function showComboReaction(combo) {
            let text = "GREAT!";
            let color = "#ffeb3b"; 
            if (combo === 2) { text = "EXCELLENT!!"; color = "#00e676"; }
            else if (combo === 3) { text = "AMAZING!!!"; color = "#00b0ff"; }
            else if (combo >= 4) { text = "UNBELIEVABLE!!!!"; color = "#d500f9"; }

            comboTextEl.textContent = text;
            comboTextEl.style.textShadow = `0 0 15px ${color}, 0 0 30px ${color}`;
            comboTextEl.className = ''; 
            void comboTextEl.offsetWidth; 
            comboTextEl.className = 'combo-animate';
        }

        async function playAllClearAnimation() {
            const colors = ['#e91e63', '#00bcd4', '#ffeb3b', '#4caf50', '#ff9800', '#9c27b0', '#03a9f4', '#3f51b5'];
            
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const cell = boardEl.children[r * COLS + c];
                    cell.style.backgroundColor = colors[r];
                    cell.style.color = colors[r];
                    cell.classList.add('glow-blast');
                }
                await new Promise(resolve => setTimeout(resolve, 50));
            }

            await new Promise(resolve => setTimeout(resolve, 150));

            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const cell = boardEl.children[r * COLS + c];
                    createExplosion(cell, colors[r]);
                }
            }

            boardState = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
            applyRandomTheme(); 
            clearPreview();
            
            addScore(1000); 
            showComboReaction(4); 
        }

        function processPlacement(target) {
            let placed = false;
            if (!activeBlock) return;
            const slotIndex = parseInt(activeBlock.dataset.slotIndex);
            const block = rackSlots[slotIndex];

            if (target && target.classList.contains('cell') && block) {
                const startRow = parseInt(target.dataset.row);
                const startCol = parseInt(target.dataset.col);

                if (canBlockFit(startRow, startCol, block)) {
                    let tileCount = 0;
                    for (let r = 0; r < block.rows; r++) {
                        for (let c = 0; c < block.cols; c++) {
                            if (block.shape[r][c] === 1) {
                                boardState[startRow + r][startCol + c] = block.color;
                                const targetCell = boardEl.children[(startRow + r) * COLS + (startCol + c)];
                                targetCell.style.backgroundColor = block.color;
                                tileCount++;
                            }
                        }
                    }
                    
                    addScore(tileCount * 10);
                    checkAndBlast();
                    
                    rackSlots[slotIndex] = null;
                    placed = true;
                }
            }

            activeBlock.style.position = 'relative'; activeBlock.style.left = '0px'; activeBlock.style.top = '0px'; activeBlock.style.zIndex = '10'; activeBlock = null;

            if (placed) {
                if (rackSlots.every(slot => slot === null)) {
                    spawnBlocks();
                } else {
                    renderRack();
                    checkGameOver();
                }
            } else {
                renderRack();
            }
        }

        function addScore(amount) {
            score += amount; currentScoreEl.textContent = score;
            if (score > bestScore) { bestScore = score; bestScoreEl.textContent = bestScore; }
        }

        function checkAndBlast() {
            let rowsToBlast = [];
            let colsToBlast = [];

            for (let r = 0; r < ROWS; r++) {
                if (boardState[r].every(cell => cell !== 0)) rowsToBlast.push(r);
            }
            for (let c = 0; c < COLS; c++) {
                let colFull = true;
                for (let r = 0; r < ROWS; r++) {
                    if (boardState[r][c] === 0) { colFull = false; break; }
                }
                if (colFull) colsToBlast.push(c);
            }

            const linesBlasted = rowsToBlast.length + colsToBlast.length;
            
            if (linesBlasted > 0) {
                comboCount++; 
                addScore(linesBlasted * 150 * comboCount); 
                showComboReaction(comboCount); 

                rowsToBlast.forEach(r => {
                    for(let c = 0; c < COLS; c++) {
                        const cell = boardEl.children[r * COLS + c];
                        cell.style.color = boardState[r][c];
                        cell.classList.add('glow-blast');
                    }
                });
                colsToBlast.forEach(c => {
                    for(let r = 0; r < ROWS; r++) {
                        const cell = boardEl.children[r * COLS + c];
                        cell.style.color = boardState[r][c];
                        cell.classList.add('glow-blast');
                    }
                });

                setTimeout(() => {
                    rowsToBlast.forEach(r => {
                        for(let c = 0; c < COLS; c++) {
                            createExplosion(boardEl.children[r * COLS + c], boardState[r][c]);
                        }
                    });
                    colsToBlast.forEach(c => {
                        for (let r = 0; r < ROWS; r++) {
                            if (boardState[r][c] !== 0 && !rowsToBlast.includes(r)) {
                                createExplosion(boardEl.children[r * COLS + c], boardState[r][c]);
                            }
                        }
                    });

                    rowsToBlast.forEach(r => {
                        boardState[r].fill(0);
                        for(let c=0; c<COLS; c++) {
                            const cell = boardEl.children[r * COLS + c];
                            cell.style.backgroundColor = currentCellColor;
                            cell.classList.remove('glow-blast');
                        }
                    });
                    colsToBlast.forEach(c => {
                        for (let r = 0; r < ROWS; r++) {
                            boardState[r][c] = 0;
                            const cell = boardEl.children[r * COLS + c];
                            cell.style.backgroundColor = currentCellColor;
                            cell.classList.remove('glow-blast');
                        }
                    });

                    let isAllClear = true;
                    for (let r = 0; r < ROWS; r++) {
                        for (let c = 0; c < COLS; c++) {
                            if (boardState[r][c] !== 0) { isAllClear = false; break; }
                        }
                    }
                    if (isAllClear) {
                        playAllClearAnimation(); 
                    }

                }, 200);

            } else {
                comboCount = 0; 
            }
        }
    </script>
</body>
</html>
