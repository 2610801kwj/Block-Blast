<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>블록 블라스터 (실시간 위치 가이드 잔상 추가)</title>
    <style>
        body {
            background: #141419; color: #fff; font-family: 'Malgun Gothic', sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; margin: 0; user-select: none;
            touch-action: none;
        }
        h1 { margin: 0 0 15px 0; color: #ffeb3b; text-shadow: 0 0 10px rgba(255,235,59,0.3); font-size: 1.8rem; }
        
        #board {
            display: grid;
            grid-template-columns: repeat(8, 42px);
            grid-template-rows: repeat(8, 42px);
            gap: 2px;
            background: #141419;
            padding: 6px;
            border: 4px solid #444;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .cell {
            background: #25252e;
            border-radius: 4px;
            box-sizing: border-box;
        }

        .divider {
            width: 350px; height: 1px; background: #333; margin: 20px 0;
        }

        #rack {
            display: flex; gap: 25px; justify-content: center; align-items: center;
            width: 350px; height: 90px; position: relative;
        }
        
        .block-container {
            display: grid; gap: 1px; position: relative; touch-action: none; z-index: 10;
        }
        .tile { border-radius: 3px; width: 28px; height: 28px; }

        .info { margin-top: 20px; color: #aaa; font-size: 0.85rem; text-align: center; width: 90%; line-height: 1.4; }
    </style>
</head>
<body>

    <h1>🧱 BLOCK BLAST</h1>
    
    <div id="board"></div>
    <div class="divider"></div>
    <div id="rack"></div>

    <div class="info">💡 블록을 격자판 위로 가져가면 <b>놓일 자리가 연한 색 잔상</b>으로 표시됩니다!</div>

    <script>
        const boardEl = document.getElementById('board');
        const rackEl = document.getElementById('rack');

        const ROWS = 8, COLS = 8;
        const boardState = Array.from({ length: ROWS }, () => Array(COLS).fill(0));

        // 8x8 격자판 생성
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.dataset.row = r;
                cell.dataset.col = c;
                boardEl.appendChild(cell);
            }
        }

        function placeFixedTile(r, c, color) {
            boardState[r][c] = color;
            const targetCell = boardEl.children[r * COLS + c];
            targetCell.style.backgroundColor = color;
        }

        const blockTemplates = [
            { shape: [[1, 1], [1, 1]], color: '#00bcd4', rows: 2, cols: 2 },
            { shape: [[1, 1, 1]], color: '#e91e63', rows: 1, cols: 3 },
            { shape: [[1, 0], [1, 1]], color: '#ffeb3b', rows: 2, cols: 2 }
        ];

        function renderRack() {
            rackEl.innerHTML = '';
            blockTemplates.forEach((tmpl, index) => {
                const box = document.createElement('div');
                box.className = 'block-container';
                box.style.gridTemplateRows = `repeat(${tmpl.rows}, 29px)`;
                box.style.gridTemplateColumns = `repeat(${tmpl.cols}, 29px)`;
                box.dataset.index = index;

                for (let r = 0; r < tmpl.rows; r++) {
                    for (let c = 0; c < tmpl.cols; c++) {
                        const tile = document.createElement('div');
                        tile.className = 'tile';
                        if (tmpl.shape[r][c] === 1) {
                            tile.style.backgroundColor = tmpl.color;
                        } else {
                            tile.style.backgroundColor = 'transparent';
                        }
                        box.appendChild(tile);
                    }
                }

                box.addEventListener('touchstart', handleTouchStart, { passive: false });
                box.addEventListener('touchmove', handleTouchMove, { passive: false });
                box.addEventListener('touchend', handleTouchEnd, { passive: false });
                box.addEventListener('mousedown', handleMouseDown);

                rackEl.appendChild(box);
            });
        }

        // --- 실시간 잔상(하이라이트) 표시 시스템 ---
        function clearPreview() {
            // 보드판의 색상 중 기존에 박힌 블록이 아닌 임시 잔상(#25252e가 아니고 실제 세팅 안된 칸)을 초기화
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const cell = boardEl.children[r * COLS + c];
                    if (boardState[r][c] === 0) {
                        cell.style.backgroundColor = '#25252e';
                        cell.style.opacity = '1';
                    }
                }
            }
        }

        function updatePreview(target, block) {
            clearPreview(); // 일단 이전 프레임 잔상 삭제
            if (!target || !target.classList.contains('cell')) return;

            const startRow = parseInt(target.dataset.row);
            const startCol = parseInt(target.dataset.col);

            // 놓을 수 있는지 검사
            let canPlace = true;
            if (startRow + block.rows <= ROWS && startCol + block.cols <= COLS) {
                for (let r = 0; r < block.rows; r++) {
                    for (let c = 0; c < block.cols; c++) {
                        if (block.shape[r][c] === 1 && boardState[startRow + r][startCol + c] !== 0) {
                            canPlace = false;
                        }
                    }
                }
            } else {
                canPlace = false;
            }

            // 놓을 수 있는 자리에만 연한 색상(투명도 0.35) 가이드 표시
            if (canPlace) {
                for (let r = 0; r < block.rows; r++) {
                    for (let c = 0; c < block.cols; c++) {
                        if (block.shape[r][c] === 1) {
                            const cell = boardEl.children[(startRow + r) * COLS + (startCol + c)];
                            cell.style.backgroundColor = block.color;
                            cell.style.opacity = '0.35'; // [보정] 연한 색상으로 인식되게 반투명 처리
                        }
                    }
                }
            }
        }

        // --- 터치 및 마우스 이동 인터랙션 처리 ---
        let activeBlock = null;
        const TOUCH_OFFSET_Y = -50;

        function handleTouchStart(e) {
            e.preventDefault();
            activeBlock = this;
            const touch = e.touches[0];
            activeBlock.style.position = 'fixed';
            activeBlock.style.zIndex = '1000';
            activeBlock.style.transform = 'scale(1.1)';
            moveBlock(touch.clientX, touch.clientY);
        }

        function handleTouchMove(e) {
            if (!activeBlock) return;
            e.preventDefault();
            const touch = e.touches[0];
            moveBlock(touch.clientX, touch.clientY);

            // 이동할 때 실시간으로 아래에 있는 격자 칸을 감지해서 잔상 업데이트
            const target = document.elementFromPoint(touch.clientX, touch.clientY + TOUCH_OFFSET_Y);
            const block = blockTemplates[activeBlock.dataset.index];
            updatePreview(target, block);
        }

        function handleTouchEnd(e) {
            if (!activeBlock) return;
            const touch = e.changedTouches[0];
            const target = document.elementFromPoint(touch.clientX, touch.clientY + TOUCH_OFFSET_Y);
            
            clearPreview(); // 드롭이 완료되면 잔상 레이어 클리어
            activeBlock.style.transform = 'scale(1.0)';
            processPlacement(target);
        }

        function moveBlock(clientX, clientY) {
            const rect = activeBlock.getBoundingClientRect();
            activeBlock.style.left = `${clientX - rect.width / 2}px`;
            activeBlock.style.top = `${clientY - rect.height / 2 + TOUCH_OFFSET_Y}px`;
        }

        // --- PC 마우스 드래그 & 잔상 처리 ---
        let mouseDragBlock = null;
        function handleMouseDown(e) {
            mouseDragBlock = this;
            mouseDragBlock.style.position = 'fixed';
            mouseDragBlock.style.zIndex = '1000';
            
            const moveHandler = (ev) => {
                const rect = mouseDragBlock.getBoundingClientRect();
                mouseDragBlock.style.left = `${ev.clientX - rect.width/2}px`;
                mouseDragBlock.style.top = `${ev.clientY - rect.height/2}px`;

                const target = document.elementFromPoint(ev.clientX, ev.clientY);
                const block = blockTemplates[mouseDragBlock.dataset.index];
                updatePreview(target, block);
            };

            const upHandler = (ev) => {
                window.removeEventListener('mousemove', moveHandler);
                window.removeEventListener('mouseup', upHandler);
                const target = document.elementFromPoint(ev.clientX, ev.clientY);
                
                clearPreview();
                activeBlock = mouseDragBlock;
                processPlacement(target);
                mouseDragBlock = null;
            };

            window.addEventListener('mousemove', moveHandler);
            window.addEventListener('mouseup', upHandler);
        }

        // --- 배치 연산 및 원상 복구 ---
        function processPlacement(target) {
            let placed = false;

            if (target && target.classList.contains('cell')) {
                const startRow = parseInt(target.dataset.row);
                const startCol = parseInt(target.dataset.col);
                const blockIndex = activeBlock.dataset.index;
                const block = blockTemplates[blockIndex];

                let canPlace = true;
                if (startRow + block.rows <= ROWS && startCol + block.cols <= COLS) {
                    for (let r = 0; r < block.rows; r++) {
                        for (let c = 0; c < block.cols; c++) {
                            if (block.shape[r][c] === 1 && boardState[startRow + r][startCol + c] !== 0) {
                                canPlace = false;
                            }
                        }
                    }
                } else {
                    canPlace = false;
                }

                if (canPlace) {
                    for (let r = 0; r < block.rows; r++) {
                        for (let c = 0; c < block.cols; c++) {
                            if (block.shape[r][c] === 1) {
                                placeFixedTile(startRow + r, startCol + c, block.color);
                            }
                        }
                    }
                    checkAndBlast();
                    placed = true;
                }
            }

            activeBlock.style.position = 'relative';
            activeBlock.style.left = '0px';
            activeBlock.style.top = '0px';
            activeBlock.style.zIndex = '10';
            activeBlock = null;

            if (placed) {
                renderRack();
            }
        }

        // 라인 삭제(Blast) 시스템
        function checkAndBlast() {
            let rowsToBlast = [];
            let colsToBlast = [];

            for (let r = 0; r < ROWS; r++) {
                if (boardState[r].every(cell => cell !== 0)) rowsToBlast.push(r);
            }
            for (let c = 0; c < COLS; c++) {
                let colFull = true;
                for (let r = 0; r < ROWS; r++) {
                    if (boardState[r][c] === 0) { colFull = false; break; }
                }
                if (colFull) colsToBlast.push(c);
            }

            rowsToBlast.forEach(r => {
                boardState[r].fill(0);
                for(let c=0; c<COLS; c++) {
                    boardEl.children[r * COLS + c].style.backgroundColor = '#25252e';
                    boardEl.children[r * COLS + c].style.opacity = '1';
                }
            });
            colsToBlast.forEach(c => {
                for (let r = 0; r < ROWS; r++) {
                    boardState[r][c] = 0;
                    boardEl.children[r * COLS + c].style.backgroundColor = '#25252e';
                    boardEl.children[r * COLS + c].style.opacity = '1';
                }
            });
        }

        renderRack();
    </script>
</body>
</html>
