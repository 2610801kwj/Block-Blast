<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>블록 블라스터 - 플레이 버그 수정판</title>
    <style>
        body {
            background: #111216; color: #fff; font-family: 'Segoe UI', sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; margin: 0; user-select: none; touch-action: none;
            overflow: hidden;
        }
        
        #homeScreen {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #111216; z-index: 6000; gap: 20px;
        }
        #homeScreen h1 {
            font-size: 3rem; color: #ffeb3b; margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(255,235,59,0.5);
        }
        .main-btn {
            background: #4caf50; color: #fff; border: none; padding: 16px 45px; 
            font-size: 1.4rem; font-weight: bold; border-radius: 8px; cursor: pointer;
            box-shadow: 0 5px 15px rgba(76,175,80,0.4); transition: 0.2s;
        }
        .beta-btn {
            background: #9c27b0; box-shadow: 0 5px 15px rgba(156,39,176,0.4);
        }
        .main-btn:active { transform: scale(0.95); }

        #uploadModal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 6500; flex-direction: column; align-items: center; justify-content: center;
            gap: 20px;
        }

        .score-container { 
            display: flex; gap: 50px; margin-bottom: 10px; font-size: 1.4rem; font-weight: bold; 
            transform: translate3d(0,0,0);
        }
        .score-box { text-align: center; }
        .score-val { color: #ffeb3b; font-size: 2rem; text-shadow: 0 0 15px rgba(255,235,59,0.4); }

        #board {
            display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); gap: 4px;
            padding: 12px; border: 5px solid #333; border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6); position: relative; 
            width: 94vw; height: 94vw; max-width: 430px; max-height: 430px;
            box-sizing: border-box;
            background: #15161a;
            transform: translate3d(0,0,0);
        }
        
        .cell { 
            background: #202124; border-radius: 6px; box-sizing: border-box; 
            position: relative; overflow: hidden;
            transform: translate3d(0,0,0);
        }

        .cell-img-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-repeat: no-repeat;
            background-size: 800% 800%;
            background-position: var(--pos-x, 0%) var(--pos-y, 0%);
            opacity: 0;
            will-change: opacity;
            transform: translate3d(0,0,0);
        }

        .cell.glow-blast {
            filter: blur(1px) brightness(1.8);
            box-shadow: 0 0 15px currentColor, inset 0 0 8px currentColor;
            z-index: 50;
        }

        .divider { width: 94vw; max-width: 430px; height: 1px; background: rgba(255,255,255,0.1); margin: 15px 0; }
        
        #rack { 
            display: flex; gap: 20px; justify-content: center; align-items: center; 
            width: 94vw; max-width: 430px; height: 140px; position: relative; 
            transform: translate3d(0,0,0);
        }
        
        .block-container { display: grid; gap: 3px; position: relative; touch-action: none; z-index: 10; cursor: grab; transform: translate3d(0,0,0); }
        .block-container.dragging { transform: scale(1.05) translate3d(0,0,0) !important; }
        
        .tile { border-radius: 5px; width: 36px; height: 36px; box-sizing: border-box; pointer-events: none; transform: translate3d(0,0,0); }

        .particle {
            position: fixed; width: 8px; height: 8px; border-radius: 2px;
            pointer-events: none; z-index: 2000; animation: explode 0.4s ease-out forwards;
        }
        @keyframes explode {
            0% { transform: translate3d(0, 0, 0) scale(1); opacity: 1; }
            100% { transform: translate3d(var(--dx), var(--dy), 0) scale(0); opacity: 0; }
        }

        #comboText {
            position: fixed; font-size: 2.5rem; font-weight: 900; color: #fff;
            text-shadow: 0 0 15px #ff1744, 0 0 30px #ff1744; pointer-events: none;
            z-index: 4000; opacity: 0; transform: scale(0.3) translate3d(0,0,0); text-align: center;
        }
        .combo-animate { animation: popText 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

        @keyframes popText {
            0% { opacity: 0; transform: scale(0.3) rotate(-5deg) translate3d(0,0,0); }
            30% { opacity: 1; transform: scale(1.1) rotate(5deg) translate3d(0,0,0); }
            50% { transform: scale(1) rotate(0deg) translate3d(0,0,0); }
            80% { opacity: 1; transform: translateY(-30px) scale(1) translate3d(0,0,0); }
            100% { opacity: 0; transform: translateY(-50px) scale(0.8) translate3d(0,0,0); }
        }

        #gameOverModal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); z-index: 5000; flex-direction: column; align-items: center; justify-content: center;
        }
        .modal-content {
            background: #22222b; padding: 35px 40px; border-radius: 12px; text-align: center;
            border: 3px solid #ff5722; box-shadow: 0 0 20px rgba(255,87,34,0.4);
        }
        .modal-content h2 { color: #ff5722; margin: 0 0 10px 0; font-size: 2.2rem; }
        .modal-content p { font-size: 1.1rem; margin: 10px 0 25px 0; color: #ccc; }
        .modal-btn-group { display: flex; gap: 15px; justify-content: center; }
        .modal-btn {
            color: #fff; border: none; padding: 12px 24px; font-size: 1.1rem; font-weight: bold;
            border-radius: 6px; cursor: pointer; transition: 0.2s; min-width: 110px;
        }
        .btn-replay { background: #ff5722; }
        .btn-home { background: #555; }
    </style>
</head>
<body>

    <div id="homeScreen">
        <h1>🧱 BLOCK BLAST</h1>
        <button class="main-btn" onclick="startGame(false)">PLAY GAME</button>
        <button class="main-btn beta-btn" onclick="openBetaModal()">🧪 β-test MODE</button>
    </div>

    <div id="uploadModal">
        <h2>사진을 업로드하세요</h2>
        <input type="file" id="imageInput" accept="image/*">
        <button class="main-btn beta-btn" onclick="startBetaGame()">게임 시작</button>
    </div>

    <div id="comboText">GREAT!</div>

    <div class="score-container">
        <div class="score-box">SCORE<br><span id="currentScore" class="score-val">0</span></div>
        <div class="score-box">BEST<br><span id="bestScore" class="score-val">0</span></div>
    </div>
    
    <div id="board"></div>
    <div class="divider"></div>
    <div id="rack"></div>

    <div id="gameOverModal">
        <div class="modal-content">
            <h2>GAME OVER</h2>
            <p>더 이상 블록을 놓을 공간이 없습니다!</p>
            <div class="modal-btn-group">
                <button class="modal-btn btn-replay" onclick="resetGame()">REPLAY</button>
                <button class="modal-btn btn-home" onclick="goHome()">HOME</button>
            </div>
        </div>
    </div>

    <script>
        const boardEl = document.getElementById('board');
        const rackEl = document.getElementById('rack');
        const currentScoreEl = document.getElementById('currentScore');
        const bestScoreEl = document.getElementById('bestScore');
        const gameOverModal = document.getElementById('gameOverModal');
        const homeScreen = document.getElementById('homeScreen');
        const uploadModal = document.getElementById('uploadModal');
        const imageInput = document.getElementById('imageInput');
        const comboTextEl = document.getElementById('comboText');

        const ROWS = 8;
        const COLS = 8;
        let boardState = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
        
        let score = 0;
        let bestScore = 0;
        let activeBlock = null;
        let rackSlots = [null, null, null];
        let comboCount = 0;

        let dragOffsetX = 0;
        let dragOffsetY = 0;
        let startTileRowOffset = 0;
        let startTileColOffset = 0;

        let isBetaMode = false;
        let uploadedImgUrl = "";
        let currentLargestComponent = new Set(); 

        let currentCellColor = '#202124';

        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.dataset.row = r;
                cell.dataset.col = c;
                
                const imgLayer = document.createElement('div');
                imgLayer.className = 'cell-img-layer';
                
                const posX = (c / (COLS - 1)) * 100;
                const posY = (r / (ROWS - 1)) * 100;
                imgLayer.style.setProperty('--pos-x', `${posX}%`);
                imgLayer.style.setProperty('--pos-y', `${posY}%`);
                
                cell.appendChild(imgLayer);
                boardEl.appendChild(cell);
            }
        }

        const blockPool = [
            { shape: [[1]], color: '#ffeb3b', rows: 1, cols: 1 }, 
            { shape: [[1, 1]], color: '#ff9800', rows: 1, cols: 2 }, 
            { shape: [[1], [1]], color: '#ff9800', rows: 2, cols: 1 }, 
            { shape: [[1, 1, 1]], color: '#e91e63', rows: 1, cols: 3 }, 
            { shape: [[1], [1], [1]], color: '#e91e63', rows: 3, cols: 1 }, 
            { shape: [[1, 1, 1, 1]], color: '#03a9f4', rows: 1, cols: 4 }, 
            { shape: [[1], [1], [1], [1]], color: '#03a9f4', rows: 4, cols: 1 }, 
            { shape: [[1, 1], [1, 1]], color: '#4caf50', rows: 2, cols: 2 }, 
            { shape: [[1, 1, 1], [1, 1, 1], [1, 1, 1]], color: '#9c27b0', rows: 3, cols: 3 }, 
            { shape: [[1, 0], [1, 0], [1, 1]], color: '#3f51b5', rows: 3, cols: 2 }, 
            { shape: [[1, 1, 1], [1, 0, 0]], color: '#3f51b5', rows: 2, cols: 3 }, 
            { shape: [[0, 1], [0, 1], [1, 1]], color: '#00bcd4', rows: 3, cols: 2 }, 
            { shape: [[1, 1], [0, 1], [0, 1]], color: '#00bcd4', rows: 3, cols: 2 }, 
            { shape: [[0, 1, 0], [1, 1, 1]], color: '#ec407a', rows: 2, cols: 3 }
        ];

        function openBetaModal() { uploadModal.style.display = 'flex'; }

        function startBetaGame() {
            const file = imageInput.files[0];
            if (!file) { alert("사진을 선택해주세요!"); return; }
            const reader = new FileReader();
            reader.onload = function(e) {
                uploadedImgUrl = e.target.result;
                for(let i=0; i<ROWS*COLS; i++) {
                    boardEl.children[i].querySelector('.cell-img-layer').style.backgroundImage = `url(${uploadedImgUrl})`;
                }
                uploadModal.style.display = 'none';
                homeScreen.style.display = 'none';
                startGame(true);
            };
            reader.readAsDataURL(file);
        }

        function startGame(betaMode = false) {
            isBetaMode = betaMode;
            currentLargestComponent.clear();
            homeScreen.style.display = 'none';
            if (isBetaMode) {
                document.body.style.background = '#15161a';
                boardEl.style.background = '#15161a';
                boardEl.style.borderColor = '#9c27b0';
                currentCellColor = '#222328';
            }
            resetGame();
        }

        function goHome() { gameOverModal.style.display = 'none'; homeScreen.style.display = 'flex'; }

        function spawnBlocks() {
            for (let i = 0; i < 3; i++) {
                const randIndex = Math.floor(Math.random() * blockPool.length);
                rackSlots[i] = blockPool[randIndex];
            }
            renderRack();
            checkGameOver();
        }

        function renderRack() {
            rackEl.innerHTML = '';
            rackSlots.forEach((block, slotIndex) => {
                if (!block) {
                    const emptyBox = document.createElement('div');
                    emptyBox.style.width = '90px';
                    rackEl.appendChild(emptyBox);
                    return;
                }

                const box = document.createElement('div');
                box.className = 'block-container';
                box.style.gridTemplateRows = `repeat(${block.rows}, 36px)`;
                box.style.gridTemplateColumns = `repeat(${block.cols}, 36px)`;
                box.dataset.slotIndex = slotIndex;
                box.style.transform = 'scale(0.85)';
                box.style.transformOrigin = 'center center';

                for (let r = 0; r < block.rows; r++) {
                    for (let c = 0; c < block.cols; c++) {
                        const tile = document.createElement('div');
                        tile.className = 'tile';
                        if (block.shape[r][c] === 1) {
                            tile.style.backgroundColor = block.color;
                            tile.style.boxShadow = 'inset 0 0 5px rgba(255,255,255,0.3)';
                        } else {
                            tile.style.backgroundColor = 'transparent';
                        }
                        box.appendChild(tile);
                    }
                }

                box.addEventListener('touchstart', handleTouchStart, { passive: false });
                box.addEventListener('touchmove', handleTouchMove, { passive: false });
                box.addEventListener('touchend', handleTouchEnd, { passive: false });
                box.addEventListener('mousedown', handleMouseDown);

                rackEl.appendChild(box);
            });
        }

        function refreshBoardGraphics(runBFS = false) {
            if (isBetaMode && runBFS) {
                currentLargestComponent = findLargestConnectedComponent();
            }

            for (let r = 0; r < ROWS; r++) {
                const rowOffset = r * COLS;
                for (let c = 0; c < COLS; c++) {
                    const cell = boardEl.children[rowOffset + c];
                    const imgLayer = cell.querySelector('.cell-img-layer');
                    cell.classList.remove('glow-blast');
                    
                    if (boardState[r][c] !== 0) {
                        const key = (r << 4) | c;
                        if (isBetaMode && currentLargestComponent.has(key)) {
                            cell.style.backgroundColor = 'transparent';
                            imgLayer.style.opacity = '1';
                        } else {
                            imgLayer.style.opacity = '0';
                            cell.style.backgroundColor = boardState[r][c];
                        }
                    } else {
                        imgLayer.style.opacity = '0';
                        cell.style.backgroundColor = currentCellColor;
                    }
                }
            }
        }

        function findLargestConnectedComponent() {
            let visited = new Uint8Array(128); 
            let maxComponent = new Set();
            const dr = [-1, 1, 0, 0];
            const dc = [0, 0, -1, 1];

            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const startKey = (r << 4) | c;
                    if (boardState[r][c] !== 0 && !visited[startKey]) {
                        let currentComponent = new Set();
                        let queue = [startKey];
                        visited[startKey] = 1;

                        while (queue.length > 0) {
                            const curr = queue.shift();
                            currentComponent.add(curr);

                            const currR = curr >> 4;
                            const currC = curr & 15;

                            for (let i = 0; i < 4; i++) {
                                const nr = currR + dr[i];
                                const nc = currC + dc[i];
                                if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
                                    const nextKey = (nr << 4) | nc;
                                    if (boardState[nr][nc] !== 0 && !visited[nextKey]) {
                                        visited[nextKey] = 1;
                                        queue.push(nextKey);
                                    }
                                }
                            }
                        }
                        if (currentComponent.size > maxComponent.size) {
                            maxComponent = currentComponent;
                        }
                    }
                }
            }
            return maxComponent;
        }

        /* [플레이 불가 버그 해결 포인트] 드롭 판정 타겟 보정 영역을 더 정밀하고 넓게 확장 */
        function getTargetBoardPos(clientX, clientY, block) {
            const boardRect = boardEl.getBoundingClientRect();
            
            // 드롭 판정이 너무 빡빡해서 나가는 현상을 막기 위해 마진값 15px 허용
            if (clientX < boardRect.left - 15 || clientX > boardRect.right + 15 || clientY < boardRect.top - 15 || clientY > boardRect.bottom + 15) {
                return null;
            }
            
            const cellSize = boardRect.width / 8;
            
            // 타일의 절대좌표 기준 정확한 격자 매핑 계산
            const c = Math.floor((clientX - boardRect.left) / cellSize);
            const r = Math.floor((clientY - boardRect.top) / cellSize);
            
            const finalRow = r - startTileRowOffset;
            const finalCol = c - startTileColOffset;
            
            return { startRow: finalRow, startCol: finalCol };
        }

        function updatePreview(clientX, clientY, slotIndex) {
            refreshBoardGraphics(false); 
            const block = rackSlots[slotIndex];
            if (!block) return;

            const pos = getTargetBoardPos(clientX, clientY, block);
            if (!pos) return;
            const { startRow, startCol } = pos;

            if (canBlockFit(startRow, startCol, block)) {
                let virtualBoard = boardState.map(row => [...row]);

                for (let r = 0; r < block.rows; r++) {
                    for (let c = 0; c < block.cols; c++) {
                        if (block.shape[r][c] === 1) {
                            const vr = startRow + r;
                            const vc = startCol + c;
                            if (vr >= 0 && vr < ROWS && vc >= 0 && vc < COLS) {
                                const cell = boardEl.children[vr * COLS + vc];
                                cell.style.backgroundColor = block.color;
                                cell.querySelector('.cell-img-layer').style.opacity = '0';
                                virtualBoard[vr][vc] = block.color;
                            }
                        }
                    }
                }

                let predictRows = [];
                let predictCols = [];
                for (let r = 0; r < ROWS; r++) {
                    if (virtualBoard[r].every(cell => cell !== 0)) predictRows.push(r);
                }
                for (let c = 0; c < COLS; c++) {
                    let colFull = true;
                    for (let r = 0; r < ROWS; r++) {
                        if (virtualBoard[r][c] === 0) { colFull = false; break; }
                    }
                    if (colFull) predictCols.push(c);
                }

                predictRows.forEach(r => {
                    for(let c = 0; c < COLS; c++) boardEl.children[r * COLS + c].classList.add('glow-blast');
                });
                predictCols.forEach(c => {
                    for(let r = 0; r < ROWS; r++) boardEl.children[r * COLS + c].classList.add('glow-blast');
                });
            }
        }

        function canBlockFit(startRow, startCol, block) {
            if (startRow < 0 || startCol < 0 || startRow + block.rows > ROWS || startCol + block.cols > COLS) return false;
            for (let r = 0; r < block.rows; r++) {
                for (let c = 0; c < block.cols; c++) {
                    if (block.shape[r][c] === 1 && boardState[startRow + r][startCol + c] !== 0) return false;
                }
            }
            return true;
        }

        function checkGameOver() {
            const availableBlocks = rackSlots.filter(b => b !== null);
            if (availableBlocks.length === 0) return;
            for (let block of availableBlocks) {
                for (let r = 0; r < ROWS; r++) {
                    for (let c = 0; c < COLS; c++) {
                        if (canBlockFit(r, c, block)) return; 
                    }
                }
            }
            gameOverModal.style.display = 'flex';
        }

        function resetGame() {
            score = 0; comboCount = 0;
            currentScoreEl.textContent = '0';
            boardState = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
            currentLargestComponent.clear();
            refreshBoardGraphics(false);
            gameOverModal.style.display = 'none';
            spawnBlocks();
        }

        function handleTouchStart(e) {
            e.preventDefault(); activeBlock = this; activeBlock.classList.add('dragging');
            const touch = e.touches[0]; const rect = activeBlock.getBoundingClientRect();
            dragOffsetX = rect.width / 2; dragOffsetY = rect.height / 2;
            const slotIndex = parseInt(activeBlock.dataset.slotIndex); const block = rackSlots[slotIndex];
            startTileColOffset = Math.floor((touch.clientX - rect.left) / (rect.width / block.cols));
            startTileRowOffset = Math.floor((touch.clientY - rect.top) / (rect.height / block.rows));
            activeBlock.style.position = 'fixed'; activeBlock.style.zIndex = '1000'; activeBlock.style.pointerEvents = 'none';
            moveBlock(touch.clientX, touch.clientY);
            updatePreview(touch.clientX, touch.clientY, slotIndex);
        }

        function handleTouchMove(e) {
            if (!activeBlock) return; e.preventDefault(); const touch = e.touches[0];
            moveBlock(touch.clientX, touch.clientY); updatePreview(touch.clientX, touch.clientY, activeBlock.dataset.slotIndex);
        }

        function handleTouchEnd(e) {
            if (!activeBlock) return; const touch = e.changedTouches[0];
            activeBlock.classList.remove('dragging'); activeBlock.style.transform = 'none'; activeBlock.style.pointerEvents = 'auto';
            processPlacement(touch.clientX, touch.clientY);
        }

        function handleMouseDown(e) {
            activeBlock = this; activeBlock.classList.add('dragging');
            const rect = activeBlock.getBoundingClientRect();
            dragOffsetX = rect.width / 2; dragOffsetY = rect.height / 2;
            const slotIndex = parseInt(activeBlock.dataset.slotIndex); const block = rackSlots[slotIndex];
            startTileColOffset = Math.floor((e.clientX - rect.left) / (rect.width / block.cols));
            startTileRowOffset = Math.floor((e.clientY - rect.top) / (rect.height / block.rows));
            activeBlock.style.position = 'fixed'; activeBlock.style.zIndex = '1000'; activeBlock.style.pointerEvents = 'none';
            moveBlock(e.clientX, e.clientY);

            const moveHandler = (ev) => {
                if (!activeBlock) return; moveBlock(ev.clientX, ev.clientY); updatePreview(ev.clientX, ev.clientY, slotIndex);
            };
            const upHandler = (ev) => {
                window.removeEventListener('mousemove', moveHandler); window.removeEventListener('mouseup', upHandler);
                if (!activeBlock) return; activeBlock.classList.remove('dragging'); activeBlock.style.transform = 'none'; activeBlock.style.pointerEvents = 'auto';
                processPlacement(ev.clientX, ev.clientY); 
            };
            window.addEventListener('mousemove', moveHandler); window.addEventListener('mouseup', upHandler);
        }

        function moveBlock(clientX, clientY) {
            if (!activeBlock) return; activeBlock.style.left = `${clientX - dragOffsetX}px`; activeBlock.style.top = `${clientY - dragOffsetY}px`;
        }

        function createExplosion(cellEl, color) {
            const rect = cellEl.getBoundingClientRect();
            for (let i = 0; i < 6; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle'; 
                particle.style.backgroundColor = color || '#ff1744';
                particle.style.left = `${rect.left + rect.width / 2}px`; particle.style.top = `${rect.top + rect.height / 2}px`;
                const angle = Math.random() * Math.PI * 2; const distance = Math.random() * 50 + 30;
                particle.style.setProperty('--dx', `${Math.cos(angle) * distance}px`); particle.style.setProperty('--dy', `${Math.sin(angle) * distance}px`);
                document.body.appendChild(particle); setTimeout(() => { particle.remove(); }, 400);
            }
        }

        function showComboReaction(combo) {
            let text = "GREAT!"; let color = "#ffeb3b"; 
            if (combo === 2) { text = "EXCELLENT!!"; color = "#00e676"; } 
            else if (combo === 3) { text = "AMAZING!!!"; color = "#00b0ff"; } 
            else if (combo >= 4) { text = "UNBELIEVABLE!!!!"; color = "#d500f9"; }
            comboTextEl.textContent = text; comboTextEl.style.textShadow = `0 0 15px ${color}, 0 0 30px ${color}`;
            comboTextEl.className = ''; void comboTextEl.offsetWidth; comboTextEl.className = 'combo-animate';
        }

        function processPlacement(clientX, clientY) {
            let placed = false; if (!activeBlock) return;
            const slotIndex = parseInt(activeBlock.dataset.slotIndex); const block = rackSlots[slotIndex];

            if (block) {
                const pos = getTargetBoardPos(clientX, clientY, block);
                if (pos) {
                    const { startRow, startCol } = pos;
                    if (canBlockFit(startRow, startCol, block)) {
                        let tileCount = 0;
                        for (let r = 0; r < block.rows; r++) {
                            for (let c = 0; c < block.cols; c++) {
                                if (block.shape[r][c] === 1) {
                                    boardState[startRow + r][startCol + c] = block.color;
                                    tileCount++;
                                }
                            }
                        }
                        addScore(tileCount * 10);
                        rackSlots[slotIndex] = null; placed = true;
                        
                        refreshBoardGraphics(false);
                        checkAndBlast();
                    }
                }
            }

            if (activeBlock) {
                activeBlock.style.position = 'relative'; activeBlock.style.left = '0px'; activeBlock.style.top = '0px'; activeBlock.style.zIndex = '10'; activeBlock = null;
            }
            
            if (placed) {
                if (rackSlots.every(slot => slot === null)) spawnBlocks();
                else { renderRack(); }
            } else { renderRack(); refreshBoardGraphics(false); }
        }

        function addScore(amount) {
            score += amount; currentScoreEl.textContent = score;
            if (score > bestScore) { bestScore = score; bestScoreEl.textContent = bestScore; }
        }

        function checkAndBlast() {
            let rowsToBlast = []; let colsToBlast = [];
            for (let r = 0; r < ROWS; r++) { if (boardState[r].every(cell => cell !== 0)) rowsToBlast.push(r); }
            for (let c = 0; c < COLS; c++) {
                let colFull = true;
                for (let r = 0; r < ROWS; r++) { if (boardState[r][c] === 0) { colFull = false; break; } }
                if (colFull) colsToBlast.push(c);
            }

            if (rowsToBlast.length + colsToBlast.length > 0) {
                comboCount++; addScore((rowsToBlast.length + colsToBlast.length) * 150 * comboCount); showComboReaction(comboCount); 

                setTimeout(() => {
                    rowsToBlast.forEach(r => { for(let c=0; c<COLS; c++) createExplosion(boardEl.children[r*COLS+c], boardState[r][c]); });
                    colsToBlast.forEach(c => { for(let r=0; r<ROWS; r++) { if (boardState[r][c] !== 0 && !rowsToBlast.includes(r)) createExplosion(boardEl.children[r*COLS+c], boardState[r][c]); } });

                    rowsToBlast.forEach(r => boardState[r].fill(0));
                    colsToBlast.forEach(c => { for(let r=0; r<ROWS; r++) boardState[r][c] = 0; });

                    requestAnimationFrame(() => {
                        refreshBoardGraphics(true); 
                        checkGameOver();            
                    });
                }, 150);
            } else {
                comboCount = 0;
                requestAnimationFrame(() => {
                    refreshBoardGraphics(true);
                    checkGameOver(); 
                });
            }
        }
    </script>
</body>

<body>

    <div id="homeScreen">
        <h1>🧱 BLOCK BLAST</h1>
        <button class="main-btn" onclick="startGame(false)">PLAY GAME</button>
        <button class="main-btn beta-btn" onclick="openBetaModal()">🧪 β-test MODE</button>
    </div>

    <div id="uploadModal">
        <h2>사진을 업로드하세요</h2>
        <input type="file" id="imageInput" accept="image/*">
        <button class="main-btn beta-btn" onclick="startBetaGame()">게임 시작</button>
    </div>

    <div id="comboText">GREAT!</div>

    <div class="score-container">
        <div class="score-box">SCORE<br><span id="currentScore" class="score-val">0</span></div>
        <div class="score-box">BEST<br><span id="bestScore" class="score-val">0</span></div>
    </div>
    
    <div id="board"></div>
    <div class="divider"></div>
    <div id="rack"></div>

    <div id="gameOverModal">
        <div class="modal-content">
            <h2>GAME OVER</h2>
            <p>더 이상 블록을 놓을 공간이 없습니다!</p>
            <div class="modal-btn-group">
                <button class="modal-btn btn-replay" onclick="resetGame()">REPLAY</button>
                <button class="modal-btn btn-home" onclick="goHome()">HOME</button>
            </div>
        </div>
    </div>

    <script>
        const boardEl = document.getElementById('board');
        const rackEl = document.getElementById('rack');
        const currentScoreEl = document.getElementById('currentScore');
        const bestScoreEl = document.getElementById('bestScore');
        const gameOverModal = document.getElementById('gameOverModal');
        const homeScreen = document.getElementById('homeScreen');
        const uploadModal = document.getElementById('uploadModal');
        const imageInput = document.getElementById('imageInput');
        const comboTextEl = document.getElementById('comboText');

        const ROWS = 8;
        const COLS = 8;
        let boardState = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
        
        let score = 0;
        let bestScore = 0;
        let activeBlock = null;
        let rackSlots = [null, null, null];
        let comboCount = 0;

        let dragOffsetX = 0;
        let dragOffsetY = 0;
        let startTileRowOffset = 0;
        let startTileColOffset = 0;

        let isBetaMode = false;
        let uploadedImgUrl = "";
        let currentLargestComponent = new Set(); 

        let currentCellColor = '#202124';

        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.dataset.row = r;
                cell.dataset.col = c;
                
                const imgLayer = document.createElement('div');
                imgLayer.className = 'cell-img-layer';
                
                const posX = (c / (COLS - 1)) * 100;
                const posY = (r / (ROWS - 1)) * 100;
                imgLayer.style.setProperty('--pos-x', `${posX}%`);
                imgLayer.style.setProperty('--pos-y', `${posY}%`);
                
                cell.appendChild(imgLayer);
                boardEl.appendChild(cell);
            }
        }

        const blockPool = [
            { shape: [[1]], color: '#ffeb3b', rows: 1, cols: 1 }, 
            { shape: [[1, 1]], color: '#ff9800', rows: 1, cols: 2 }, 
            { shape: [[1], [1]], color: '#ff9800', rows: 2, cols: 1 }, 
            { shape: [[1, 1, 1]], color: '#e91e63', rows: 1, cols: 3 }, 
            { shape: [[1], [1], [1]], color: '#e91e63', rows: 3, cols: 1 }, 
            { shape: [[1, 1, 1, 1]], color: '#03a9f4', rows: 1, cols: 4 }, 
            { shape: [[1], [1], [1], [1]], color: '#03a9f4', rows: 4, cols: 1 }, 
            { shape: [[1, 1], [1, 1]], color: '#4caf50', rows: 2, cols: 2 }, 
            { shape: [[1, 1, 1], [1, 1, 1], [1, 1, 1]], color: '#9c27b0', rows: 3, cols: 3 }, 
            { shape: [[1, 0], [1, 0], [1, 1]], color: '#3f51b5', rows: 3, cols: 2 }, 
            { shape: [[1, 1, 1], [1, 0, 0]], color: '#3f51b5', rows: 2, cols: 3 }, 
            { shape: [[0, 1], [0, 1], [1, 1]], color: '#00bcd4', rows: 3, cols: 2 }, 
            { shape: [[1, 1], [0, 1], [0, 1]], color: '#00bcd4', rows: 3, cols: 2 }, 
            { shape: [[0, 1, 0], [1, 1, 1]], color: '#ec407a', rows: 2, cols: 3 }
        ];

        function openBetaModal() { uploadModal.style.display = 'flex'; }

        function startBetaGame() {
            const file = imageInput.files[0];
            if (!file) { alert("사진을 선택해주세요!"); return; }
            const reader = new FileReader();
            reader.onload = function(e) {
                uploadedImgUrl = e.target.result;
                for(let i=0; i<ROWS*COLS; i++) {
                    boardEl.children[i].querySelector('.cell-img-layer').style.backgroundImage = `url(${uploadedImgUrl})`;
                }
                uploadModal.style.display = 'none';
                homeScreen.style.display = 'none';
                startGame(true);
            };
            reader.readAsDataURL(file);
        }

        function startGame(betaMode = false) {
            isBetaMode = betaMode;
            currentLargestComponent.clear();
            homeScreen.style.display = 'none';
            if (isBetaMode) {
                document.body.style.background = '#15161a';
                boardEl.style.background = '#15161a';
                boardEl.style.borderColor = '#9c27b0';
                currentCellColor = '#222328';
            }
            resetGame();
        }

        function goHome() { gameOverModal.style.display = 'none'; homeScreen.style.display = 'flex'; }

        function spawnBlocks() {
            for (let i = 0; i < 3; i++) {
                const randIndex = Math.floor(Math.random() * blockPool.length);
                rackSlots[i] = blockPool[randIndex];
            }
            renderRack();
            checkGameOver();
        }

        function renderRack() {
            rackEl.innerHTML = '';
            rackSlots.forEach((block, slotIndex) => {
                if (!block) {
                    const emptyBox = document.createElement('div');
                    emptyBox.style.width = '90px';
                    rackEl.appendChild(emptyBox);
                    return;
                }

                const box = document.createElement('div');
                box.className = 'block-container';
                box.style.gridTemplateRows = `repeat(${block.rows}, 36px)`;
                box.style.gridTemplateColumns = `repeat(${block.cols}, 36px)`;
                box.dataset.slotIndex = slotIndex;
                box.style.transform = 'scale(0.85)';
                box.style.transformOrigin = 'center center';

                for (let r = 0; r < block.rows; r++) {
                    for (let c = 0; c < block.cols; c++) {
                        const tile = document.createElement('div');
                        tile.className = 'tile';
                        if (block.shape[r][c] === 1) {
                            tile.style.backgroundColor = block.color;
                            tile.style.boxShadow = 'inset 0 0 5px rgba(255,255,255,0.3)';
                        } else {
                            tile.style.backgroundColor = 'transparent';
                        }
                        box.appendChild(tile);
                    }
                }

                box.addEventListener('touchstart', handleTouchStart, { passive: false });
                box.addEventListener('touchmove', handleTouchMove, { passive: false });
                box.addEventListener('touchend', handleTouchEnd, { passive: false });
                box.addEventListener('mousedown', handleMouseDown);

                rackEl.appendChild(box);
            });
        }

        function refreshBoardGraphics(runBFS = false) {
            if (isBetaMode && runBFS) {
                currentLargestComponent = findLargestConnectedComponent();
            }

            for (let r = 0; r < ROWS; r++) {
                const rowOffset = r * COLS;
                for (let c = 0; c < COLS; c++) {
                    const cell = boardEl.children[rowOffset + c];
                    const imgLayer = cell.querySelector('.cell-img-layer');
                    cell.classList.remove('glow-blast');
                    
                    if (boardState[r][c] !== 0) {
                        const key = (r << 4) | c;
                        if (isBetaMode && currentLargestComponent.has(key)) {
                            cell.style.backgroundColor = 'transparent';
                            imgLayer.style.opacity = '1';
                        } else {
                            imgLayer.style.opacity = '0';
                            cell.style.backgroundColor = boardState[r][c];
                        }
                    } else {
                        imgLayer.style.opacity = '0';
                        cell.style.backgroundColor = currentCellColor;
                    }
                }
            }
        }

        function findLargestConnectedComponent() {
            let visited = new Uint8Array(128); 
            let maxComponent = new Set();
            const dr = [-1, 1, 0, 0];
            const dc = [0, 0, -1, 1];

            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const startKey = (r << 4) | c;
                    if (boardState[r][c] !== 0 && !visited[startKey]) {
                        let currentComponent = new Set();
                        let queue = [startKey];
                        visited[startKey] = 1;

                        while (queue.length > 0) {
                            const curr = queue.shift();
                            currentComponent.add(curr);

                            const currR = curr >> 4;
                            const currC = curr & 15;

                            for (let i = 0; i < 4; i++) {
                                const nr = currR + dr[i];
                                const nc = currC + dc[i];
                                if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
                                    const nextKey = (nr << 4) | nc;
                                    if (boardState[nr][nc] !== 0 && !visited[nextKey]) {
                                        visited[nextKey] = 1;
                                        queue.push(nextKey);
                                    }
                                }
                            }
                        }
                        if (currentComponent.size > maxComponent.size) {
                            maxComponent = currentComponent;
                        }
                    }
                }
            }
            return maxComponent;
        }

        /* [플레이 불가 버그 해결 포인트] 드롭 판정 타겟 보정 영역을 더 정밀하고 넓게 확장 */
        function getTargetBoardPos(clientX, clientY, block) {
            const boardRect = boardEl.getBoundingClientRect();
            
            // 드롭 판정이 너무 빡빡해서 나가는 현상을 막기 위해 마진값 15px 허용
            if (clientX < boardRect.left - 15 || clientX > boardRect.right + 15 || clientY < boardRect.top - 15 || clientY > boardRect.bottom + 15) {
                return null;
            }
            
            const cellSize = boardRect.width / 8;
            
            // 타일의 절대좌표 기준 정확한 격자 매핑 계산
            const c = Math.floor((clientX - boardRect.left) / cellSize);
            const r = Math.floor((clientY - boardRect.top) / cellSize);
            
            const finalRow = r - startTileRowOffset;
            const finalCol = c - startTileColOffset;
            
            return { startRow: finalRow, startCol: finalCol };
        }

        function updatePreview(clientX, clientY, slotIndex) {
            refreshBoardGraphics(false); 
            const block = rackSlots[slotIndex];
            if (!block) return;

            const pos = getTargetBoardPos(clientX, clientY, block);
            if (!pos) return;
            const { startRow, startCol } = pos;

            if (canBlockFit(startRow, startCol, block)) {
                let virtualBoard = boardState.map(row => [...row]);

                for (let r = 0; r < block.rows; r++) {
                    for (let c = 0; c < block.cols; c++) {
                        if (block.shape[r][c] === 1) {
                            const vr = startRow + r;
                            const vc = startCol + c;
                            if (vr >= 0 && vr < ROWS && vc >= 0 && vc < COLS) {
                                const cell = boardEl.children[vr * COLS + vc];
                                cell.style.backgroundColor = block.color;
                                cell.querySelector('.cell-img-layer').style.opacity = '0';
                                virtualBoard[vr][vc] = block.color;
                            }
                        }
                    }
                }

                let predictRows = [];
                let predictCols = [];
                for (let r = 0; r < ROWS; r++) {
                    if (virtualBoard[r].every(cell => cell !== 0)) predictRows.push(r);
                }
                for (let c = 0; c < COLS; c++) {
                    let colFull = true;
                    for (let r = 0; r < ROWS; r++) {
                        if (virtualBoard[r][c] === 0) { colFull = false; break; }
                    }
                    if (colFull) predictCols.push(c);
                }

                predictRows.forEach(r => {
                    for(let c = 0; c < COLS; c++) boardEl.children[r * COLS + c].classList.add('glow-blast');
                });
                predictCols.forEach(c => {
                    for(let r = 0; r < ROWS; r++) boardEl.children[r * COLS + c].classList.add('glow-blast');
                });
            }
        }

        function canBlockFit(startRow, startCol, block) {
            if (startRow < 0 || startCol < 0 || startRow + block.rows > ROWS || startCol + block.cols > COLS) return false;
            for (let r = 0; r < block.rows; r++) {
                for (let c = 0; c < block.cols; c++) {
                    if (block.shape[r][c] === 1 && boardState[startRow + r][startCol + c] !== 0) return false;
                }
            }
            return true;
        }

        function checkGameOver() {
            const availableBlocks = rackSlots.filter(b => b !== null);
            if (availableBlocks.length === 0) return;
            for (let block of availableBlocks) {
                for (let r = 0; r < ROWS; r++) {
                    for (let c = 0; c < COLS; c++) {
                        if (canBlockFit(r, c, block)) return; 
                    }
                }
            }
            gameOverModal.style.display = 'flex';
        }

        function resetGame() {
            score = 0; comboCount = 0;
            currentScoreEl.textContent = '0';
            boardState = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
            currentLargestComponent.clear();
            refreshBoardGraphics(false);
            gameOverModal.style.display = 'none';
            spawnBlocks();
        }

        function handleTouchStart(e) {
            e.preventDefault(); activeBlock = this; activeBlock.classList.add('dragging');
            const touch = e.touches[0]; const rect = activeBlock.getBoundingClientRect();
            dragOffsetX = rect.width / 2; dragOffsetY = rect.height / 2;
            const slotIndex = parseInt(activeBlock.dataset.slotIndex); const block = rackSlots[slotIndex];
            startTileColOffset = Math.floor((touch.clientX - rect.left) / (rect.width / block.cols));
            startTileRowOffset = Math.floor((touch.clientY - rect.top) / (rect.height / block.rows));
            activeBlock.style.position = 'fixed'; activeBlock.style.zIndex = '1000'; activeBlock.style.pointerEvents = 'none';
            moveBlock(touch.clientX, touch.clientY);
            updatePreview(touch.clientX, touch.clientY, slotIndex);
        }

        function handleTouchMove(e) {
            if (!activeBlock) return; e.preventDefault(); const touch = e.touches[0];
            moveBlock(touch.clientX, touch.clientY); updatePreview(touch.clientX, touch.clientY, activeBlock.dataset.slotIndex);
        }

        function handleTouchEnd(e) {
            if (!activeBlock) return; const touch = e.changedTouches[0];
            activeBlock.classList.remove('dragging'); activeBlock.style.transform = 'none'; activeBlock.style.pointerEvents = 'auto';
            processPlacement(touch.clientX, touch.clientY);
        }

        function handleMouseDown(e) {
            activeBlock = this; activeBlock.classList.add('dragging');
            const rect = activeBlock.getBoundingClientRect();
            dragOffsetX = rect.width / 2; dragOffsetY = rect.height / 2;
            const slotIndex = parseInt(activeBlock.dataset.slotIndex); const block = rackSlots[slotIndex];
            startTileColOffset = Math.floor((e.clientX - rect.left) / (rect.width / block.cols));
            startTileRowOffset = Math.floor((e.clientY - rect.top) / (rect.height / block.rows));
            activeBlock.style.position = 'fixed'; activeBlock.style.zIndex = '1000'; activeBlock.style.pointerEvents = 'none';
            moveBlock(e.clientX, e.clientY);

            const moveHandler = (ev) => {
                if (!activeBlock) return; moveBlock(ev.clientX, ev.clientY); updatePreview(ev.clientX, ev.clientY, slotIndex);
            };
            const upHandler = (ev) => {
                window.removeEventListener('mousemove', moveHandler); window.removeEventListener('mouseup', upHandler);
                if (!activeBlock) return; activeBlock.classList.remove('dragging'); activeBlock.style.transform = 'none'; activeBlock.style.pointerEvents = 'auto';
                processPlacement(ev.clientX, ev.clientY); 
            };
            window.addEventListener('mousemove', moveHandler); window.addEventListener('mouseup', upHandler);
        }

        function moveBlock(clientX, clientY) {
            if (!activeBlock) return; activeBlock.style.left = `${clientX - dragOffsetX}px`; activeBlock.style.top = `${clientY - dragOffsetY}px`;
        }

        function createExplosion(cellEl, color) {
            const rect = cellEl.getBoundingClientRect();
            for (let i = 0; i < 6; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle'; 
                particle.style.backgroundColor = color || '#ff1744';
                particle.style.left = `${rect.left + rect.width / 2}px`; particle.style.top = `${rect.top + rect.height / 2}px`;
                const angle = Math.random() * Math.PI * 2; const distance = Math.random() * 50 + 30;
                particle.style.setProperty('--dx', `${Math.cos(angle) * distance}px`); particle.style.setProperty('--dy', `${Math.sin(angle) * distance}px`);
                document.body.appendChild(particle); setTimeout(() => { particle.remove(); }, 400);
            }
        }

        function showComboReaction(combo) {
            let text = "GREAT!"; let color = "#ffeb3b"; 
            if (combo === 2) { text = "EXCELLENT!!"; color = "#00e676"; } 
            else if (combo === 3) { text = "AMAZING!!!"; color = "#00b0ff"; } 
            else if (combo >= 4) { text = "UNBELIEVABLE!!!!"; color = "#d500f9"; }
            comboTextEl.textContent = text; comboTextEl.style.textShadow = `0 0 15px ${color}, 0 0 30px ${color}`;
            comboTextEl.className = ''; void comboTextEl.offsetWidth; comboTextEl.className = 'combo-animate';
        }

        function processPlacement(clientX, clientY) {
            let placed = false; if (!activeBlock) return;
            const slotIndex = parseInt(activeBlock.dataset.slotIndex); const block = rackSlots[slotIndex];

            if (block) {
                const pos = getTargetBoardPos(clientX, clientY, block);
                if (pos) {
                    const { startRow, startCol } = pos;
                    if (canBlockFit(startRow, startCol, block)) {
                        let tileCount = 0;
                        for (let r = 0; r < block.rows; r++) {
                            for (let c = 0; c < block.cols; c++) {
                                if (block.shape[r][c] === 1) {
                                    boardState[startRow + r][startCol + c] = block.color;
                                    tileCount++;
                                }
                            }
                        }
                        addScore(tileCount * 10);
                        rackSlots[slotIndex] = null; placed = true;
                        
                        refreshBoardGraphics(false);
                        checkAndBlast();
                    }
                }
            }

            if (activeBlock) {
                activeBlock.style.position = 'relative'; activeBlock.style.left = '0px'; activeBlock.style.top = '0px'; activeBlock.style.zIndex = '10'; activeBlock = null;
            }
            
            if (placed) {
                if (rackSlots.every(slot => slot === null)) spawnBlocks();
                else { renderRack(); }
            } else { renderRack(); refreshBoardGraphics(false); }
        }

        function addScore(amount) {
            score += amount; currentScoreEl.textContent = score;
            if (score > bestScore) { bestScore = score; bestScoreEl.textContent = bestScore; }
        }

        function checkAndBlast() {
            let rowsToBlast = []; let colsToBlast = [];
            for (let r = 0; r < ROWS; r++) { if (boardState[r].every(cell => cell !== 0)) rowsToBlast.push(r); }
            for (let c = 0; c < COLS; c++) {
                let colFull = true;
                for (let r = 0; r < ROWS; r++) { if (boardState[r][c] === 0) { colFull = false; break; } }
                if (colFull) colsToBlast.push(c);
            }

            if (rowsToBlast.length + colsToBlast.length > 0) {
                comboCount++; addScore((rowsToBlast.length + colsToBlast.length) * 150 * comboCount); showComboReaction(comboCount); 

                setTimeout(() => {
                    rowsToBlast.forEach(r => { for(let c=0; c<COLS; c++) createExplosion(boardEl.children[r*COLS+c], boardState[r][c]); });
                    colsToBlast.forEach(c => { for(let r=0; r<ROWS; r++) { if (boardState[r][c] !== 0 && !rowsToBlast.includes(r)) createExplosion(boardEl.children[r*COLS+c], boardState[r][c]); } });

                    rowsToBlast.forEach(r => boardState[r].fill(0));
                    colsToBlast.forEach(c => { for(let r=0; r<ROWS; r++) boardState[r][c] = 0; });

                    requestAnimationFrame(() => {
                        refreshBoardGraphics(true); 
                        checkGameOver();            
                    });
                }, 150);
            } else {
                comboCount = 0;
                requestAnimationFrame(() => {
                    refreshBoardGraphics(true);
                    checkGameOver(); 
                });
            }
        }
    </script>
</body>

<body>

    <div id="homeScreen">
        <h1>🧱 BLOCK BLAST!</h1>
        <button class="main-btn" onclick="startGame(false)">PLAY GAME</button>
        <button class="main-btn beta-btn" onclick="openBetaModal()">🧪 β-test MODE</button>
    </div>

    <div id="uploadModal">
        <h2>사진을 업로드하세요</h2>
        <input type="file" id="imageInput" accept="image/*">
        <button class="main-btn beta-btn" onclick="startBetaGame()">게임 시작</button>
    </div>

    <div id="comboText">GREAT!</div>

    <div class="score-container">
        <div class="score-box">SCORE<br><span id="currentScore" class="score-val">0</span></div>
        <div class="score-box">BEST<br><span id="bestScore" class="score-val">0</span></div>
    </div>
    
    <div id="board"></div>
    <div class="divider"></div>
    <div id="rack"></div>

    <div id="gameOverModal">
        <div class="modal-content">
            <h2>GAME OVER</h2>
            <p>더 이상 블록을 놓을 공간이 없습니다!</p>
            <div class="modal-btn-group">
                <button class="modal-btn btn-replay" onclick="resetGame()">REPLAY</button>
                <button class="modal-btn btn-home" onclick="goHome()">HOME</button>
            </div>
        </div>
    </div>

    <script>
        const boardEl = document.getElementById('board');
        const rackEl = document.getElementById('rack');
        const currentScoreEl = document.getElementById('currentScore');
        const bestScoreEl = document.getElementById('bestScore');
        const gameOverModal = document.getElementById('gameOverModal');
        const homeScreen = document.getElementById('homeScreen');
        const uploadModal = document.getElementById('uploadModal');
        const imageInput = document.getElementById('imageInput');
        const comboTextEl = document.getElementById('comboText');

        const ROWS = 8;
        const COLS = 8;
        let boardState = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
        
        let score = 0;
        let bestScore = 0;
        let activeBlock = null;
        let rackSlots = [null, null, null];
        let comboCount = 0;

        let dragOffsetX = 0;
        let dragOffsetY = 0;
        let startTileRowOffset = 0;
        let startTileColOffset = 0;

        let isBetaMode = false;
        let uploadedImgUrl = "";
        let currentLargestComponent = new Set(); 

        let currentCellColor = '#202124';

        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.dataset.row = r;
                cell.dataset.col = c;
                
                const imgLayer = document.createElement('div');
                imgLayer.className = 'cell-img-layer';
                
                const posX = (c / (COLS - 1)) * 100;
                const posY = (r / (ROWS - 1)) * 100;
                imgLayer.style.setProperty('--pos-x', `${posX}%`);
                imgLayer.style.setProperty('--pos-y', `${posY}%`);
                
                cell.appendChild(imgLayer);
                boardEl.appendChild(cell);
            }
        }

        const blockPool = [
            { shape: [[1]], color: '#ffeb3b', rows: 1, cols: 1 }, 
            { shape: [[1, 1]], color: '#ff9800', rows: 1, cols: 2 }, 
            { shape: [[1], [1]], color: '#ff9800', rows: 2, cols: 1 }, 
            { shape: [[1, 1, 1]], color: '#e91e63', rows: 1, cols: 3 }, 
            { shape: [[1], [1], [1]], color: '#e91e63', rows: 3, cols: 1 }, 
            { shape: [[1, 1, 1, 1]], color: '#03a9f4', rows: 1, cols: 4 }, 
            { shape: [[1], [1], [1], [1]], color: '#03a9f4', rows: 4, cols: 1 }, 
            { shape: [[1, 1], [1, 1]], color: '#4caf50', rows: 2, cols: 2 }, 
            { shape: [[1, 1, 1], [1, 1, 1], [1, 1, 1]], color: '#9c27b0', rows: 3, cols: 3 }, 
            { shape: [[1, 0], [1, 0], [1, 1]], color: '#3f51b5', rows: 3, cols: 2 }, 
            { shape: [[1, 1, 1], [1, 0, 0]], color: '#3f51b5', rows: 2, cols: 3 }, 
            { shape: [[0, 1], [0, 1], [1, 1]], color: '#00bcd4', rows: 3, cols: 2 }, 
            { shape: [[1, 1], [0, 1], [0, 1]], color: '#00bcd4', rows: 3, cols: 2 }, 
            { shape: [[0, 1, 0], [1, 1, 1]], color: '#ec407a', rows: 2, cols: 3 }
        ];

        function openBetaModal() { uploadModal.style.display = 'flex'; }

        function startBetaGame() {
            const file = imageInput.files[0];
            if (!file) { alert("사진을 선택해주세요!"); return; }
            const reader = new FileReader();
            reader.onload = function(e) {
                uploadedImgUrl = e.target.result;
                for(let i=0; i<ROWS*COLS; i++) {
                    boardEl.children[i].querySelector('.cell-img-layer').style.backgroundImage = `url(${uploadedImgUrl})`;
                }
                uploadModal.style.display = 'none';
                homeScreen.style.display = 'none';
                startGame(true);
            };
            reader.readAsDataURL(file);
        }

        function startGame(betaMode = false) {
            isBetaMode = betaMode;
            currentLargestComponent.clear();
            homeScreen.style.display = 'none';
            if (isBetaMode) {
                document.body.style.background = '#15161a';
                boardEl.style.background = '#15161a';
                boardEl.style.borderColor = '#9c27b0';
                currentCellColor = '#222328';
            }
            resetGame();
        }

        function goHome() { gameOverModal.style.display = 'none'; homeScreen.style.display = 'flex'; }

        function spawnBlocks() {
            for (let i = 0; i < 3; i++) {
                const randIndex = Math.floor(Math.random() * blockPool.length);
                rackSlots[i] = blockPool[randIndex];
            }
            renderRack();
            checkGameOver();
        }

        function renderRack() {
            rackEl.innerHTML = '';
            rackSlots.forEach((block, slotIndex) => {
                if (!block) {
                    const emptyBox = document.createElement('div');
                    emptyBox.style.width = '90px';
                    rackEl.appendChild(emptyBox);
                    return;
                }

                const box = document.createElement('div');
                box.className = 'block-container';
                box.style.gridTemplateRows = `repeat(${block.rows}, 36px)`;
                box.style.gridTemplateColumns = `repeat(${block.cols}, 36px)`;
                box.dataset.slotIndex = slotIndex;
                box.style.transform = 'scale(0.85)';
                box.style.transformOrigin = 'center center';

                for (let r = 0; r < block.rows; r++) {
                    for (let c = 0; c < block.cols; c++) {
                        const tile = document.createElement('div');
                        tile.className = 'tile';
                        if (block.shape[r][c] === 1) {
                            tile.style.backgroundColor = block.color;
                            tile.style.boxShadow = 'inset 0 0 5px rgba(255,255,255,0.3)';
                        } else {
                            tile.style.backgroundColor = 'transparent';
                        }
                        box.appendChild(tile);
                    }
                }

                box.addEventListener('touchstart', handleTouchStart, { passive: false });
                box.addEventListener('touchmove', handleTouchMove, { passive: false });
                box.addEventListener('touchend', handleTouchEnd, { passive: false });
                box.addEventListener('mousedown', handleMouseDown);

                rackEl.appendChild(box);
            });
        }

        function refreshBoardGraphics(runBFS = false) {
            if (isBetaMode && runBFS) {
                currentLargestComponent = findLargestConnectedComponent();
            }

            for (let r = 0; r < ROWS; r++) {
                const rowOffset = r * COLS;
                for (let c = 0; c < COLS; c++) {
                    const cell = boardEl.children[rowOffset + c];
                    const imgLayer = cell.querySelector('.cell-img-layer');
                    cell.classList.remove('glow-blast');
                    
                    if (boardState[r][c] !== 0) {
                        const key = (r << 4) | c;
                        if (isBetaMode && currentLargestComponent.has(key)) {
                            cell.style.backgroundColor = 'transparent';
                            imgLayer.style.opacity = '1';
                        } else {
                            imgLayer.style.opacity = '0';
                            cell.style.backgroundColor = boardState[r][c];
                        }
                    } else {
                        imgLayer.style.opacity = '0';
                        cell.style.backgroundColor = currentCellColor;
                    }
                }
            }
        }

        function findLargestConnectedComponent() {
            let visited = new Uint8Array(128); 
            let maxComponent = new Set();
            const dr = [-1, 1, 0, 0];
            const dc = [0, 0, -1, 1];

            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const startKey = (r << 4) | c;
                    if (boardState[r][c] !== 0 && !visited[startKey]) {
                        let currentComponent = new Set();
                        let queue = [startKey];
                        visited[startKey] = 1;

                        while (queue.length > 0) {
                            const curr = queue.shift();
                            currentComponent.add(curr);

                            const currR = curr >> 4;
                            const currC = curr & 15;

                            for (let i = 0; i < 4; i++) {
                                const nr = currR + dr[i];
                                const nc = currC + dc[i];
                                if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
                                    const nextKey = (nr << 4) | nc;
                                    if (boardState[nr][nc] !== 0 && !visited[nextKey]) {
                                        visited[nextKey] = 1;
                                        queue.push(nextKey);
                                    }
                                }
                            }
                        }
                        if (currentComponent.size > maxComponent.size) {
                            maxComponent = currentComponent;
                        }
                    }
                }
            }
            return maxComponent;
        }

        /* [플레이 불가 버그 해결 포인트] 드롭 판정 타겟 보정 영역을 더 정밀하고 넓게 확장 */
        function getTargetBoardPos(clientX, clientY, block) {
            const boardRect = boardEl.getBoundingClientRect();
            
            // 드롭 판정이 너무 빡빡해서 나가는 현상을 막기 위해 마진값 15px 허용
            if (clientX < boardRect.left - 15 || clientX > boardRect.right + 15 || clientY < boardRect.top - 15 || clientY > boardRect.bottom + 15) {
                return null;
            }
            
            const cellSize = boardRect.width / 8;
            
            // 타일의 절대좌표 기준 정확한 격자 매핑 계산
            const c = Math.floor((clientX - boardRect.left) / cellSize);
            const r = Math.floor((clientY - boardRect.top) / cellSize);
            
            const finalRow = r - startTileRowOffset;
            const finalCol = c - startTileColOffset;
            
            return { startRow: finalRow, startCol: finalCol };
        }

        function updatePreview(clientX, clientY, slotIndex) {
            refreshBoardGraphics(false); 
            const block = rackSlots[slotIndex];
            if (!block) return;

            const pos = getTargetBoardPos(clientX, clientY, block);
            if (!pos) return;
            const { startRow, startCol } = pos;

            if (canBlockFit(startRow, startCol, block)) {
                let virtualBoard = boardState.map(row => [...row]);

                for (let r = 0; r < block.rows; r++) {
                    for (let c = 0; c < block.cols; c++) {
                        if (block.shape[r][c] === 1) {
                            const vr = startRow + r;
                            const vc = startCol + c;
                            if (vr >= 0 && vr < ROWS && vc >= 0 && vc < COLS) {
                                const cell = boardEl.children[vr * COLS + vc];
                                cell.style.backgroundColor = block.color;
                                cell.querySelector('.cell-img-layer').style.opacity = '0';
                                virtualBoard[vr][vc] = block.color;
                            }
                        }
                    }
                }

                let predictRows = [];
                let predictCols = [];
                for (let r = 0; r < ROWS; r++) {
                    if (virtualBoard[r].every(cell => cell !== 0)) predictRows.push(r);
                }
                for (let c = 0; c < COLS; c++) {
                    let colFull = true;
                    for (let r = 0; r < ROWS; r++) {
                        if (virtualBoard[r][c] === 0) { colFull = false; break; }
                    }
                    if (colFull) predictCols.push(c);
                }

                predictRows.forEach(r => {
                    for(let c = 0; c < COLS; c++) boardEl.children[r * COLS + c].classList.add('glow-blast');
                });
                predictCols.forEach(c => {
                    for(let r = 0; r < ROWS; r++) boardEl.children[r * COLS + c].classList.add('glow-blast');
                });
            }
        }

        function canBlockFit(startRow, startCol, block) {
            if (startRow < 0 || startCol < 0 || startRow + block.rows > ROWS || startCol + block.cols > COLS) return false;
            for (let r = 0; r < block.rows; r++) {
                for (let c = 0; c < block.cols; c++) {
                    if (block.shape[r][c] === 1 && boardState[startRow + r][startCol + c] !== 0) return false;
                }
            }
            return true;
        }

        function checkGameOver() {
            const availableBlocks = rackSlots.filter(b => b !== null);
            if (availableBlocks.length === 0) return;
            for (let block of availableBlocks) {
                for (let r = 0; r < ROWS; r++) {
                    for (let c = 0; c < COLS; c++) {
                        if (canBlockFit(r, c, block)) return; 
                    }
                }
            }
            gameOverModal.style.display = 'flex';
        }

        function resetGame() {
            score = 0; comboCount = 0;
            currentScoreEl.textContent = '0';
            boardState = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
            currentLargestComponent.clear();
            refreshBoardGraphics(false);
            gameOverModal.style.display = 'none';
            spawnBlocks();
        }

        function handleTouchStart(e) {
            e.preventDefault(); activeBlock = this; activeBlock.classList.add('dragging');
            const touch = e.touches[0]; const rect = activeBlock.getBoundingClientRect();
            dragOffsetX = rect.width / 2; dragOffsetY = rect.height / 2;
            const slotIndex = parseInt(activeBlock.dataset.slotIndex); const block = rackSlots[slotIndex];
            startTileColOffset = Math.floor((touch.clientX - rect.left) / (rect.width / block.cols));
            startTileRowOffset = Math.floor((touch.clientY - rect.top) / (rect.height / block.rows));
            activeBlock.style.position = 'fixed'; activeBlock.style.zIndex = '1000'; activeBlock.style.pointerEvents = 'none';
            moveBlock(touch.clientX, touch.clientY);
            updatePreview(touch.clientX, touch.clientY, slotIndex);
        }

        function handleTouchMove(e) {
            if (!activeBlock) return; e.preventDefault(); const touch = e.touches[0];
            moveBlock(touch.clientX, touch.clientY); updatePreview(touch.clientX, touch.clientY, activeBlock.dataset.slotIndex);
        }

        function handleTouchEnd(e) {
            if (!activeBlock) return; const touch = e.changedTouches[0];
            activeBlock.classList.remove('dragging'); activeBlock.style.transform = 'none'; activeBlock.style.pointerEvents = 'auto';
            processPlacement(touch.clientX, touch.clientY);
        }

        function handleMouseDown(e) {
            activeBlock = this; activeBlock.classList.add('dragging');
            const rect = activeBlock.getBoundingClientRect();
            dragOffsetX = rect.width / 2; dragOffsetY = rect.height / 2;
            const slotIndex = parseInt(activeBlock.dataset.slotIndex); const block = rackSlots[slotIndex];
            startTileColOffset = Math.floor((e.clientX - rect.left) / (rect.width / block.cols));
            startTileRowOffset = Math.floor((e.clientY - rect.top) / (rect.height / block.rows));
            activeBlock.style.position = 'fixed'; activeBlock.style.zIndex = '1000'; activeBlock.style.pointerEvents = 'none';
            moveBlock(e.clientX, e.clientY);

            const moveHandler = (ev) => {
                if (!activeBlock) return; moveBlock(ev.clientX, ev.clientY); updatePreview(ev.clientX, ev.clientY, slotIndex);
            };
            const upHandler = (ev) => {
                window.removeEventListener('mousemove', moveHandler); window.removeEventListener('mouseup', upHandler);
                if (!activeBlock) return; activeBlock.classList.remove('dragging'); activeBlock.style.transform = 'none'; activeBlock.style.pointerEvents = 'auto';
                processPlacement(ev.clientX, ev.clientY); 
            };
            window.addEventListener('mousemove', moveHandler); window.addEventListener('mouseup', upHandler);
        }

        function moveBlock(clientX, clientY) {
            if (!activeBlock) return; activeBlock.style.left = `${clientX - dragOffsetX}px`; activeBlock.style.top = `${clientY - dragOffsetY}px`;
        }

        function createExplosion(cellEl, color) {
            const rect = cellEl.getBoundingClientRect();
            for (let i = 0; i < 6; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle'; 
                particle.style.backgroundColor = color || '#ff1744';
                particle.style.left = `${rect.left + rect.width / 2}px`; particle.style.top = `${rect.top + rect.height / 2}px`;
                const angle = Math.random() * Math.PI * 2; const distance = Math.random() * 50 + 30;
                particle.style.setProperty('--dx', `${Math.cos(angle) * distance}px`); particle.style.setProperty('--dy', `${Math.sin(angle) * distance}px`);
                document.body.appendChild(particle); setTimeout(() => { particle.remove(); }, 400);
            }
        }

        function showComboReaction(combo) {
            let text = "GREAT!"; let color = "#ffeb3b"; 
            if (combo === 2) { text = "EXCELLENT!!"; color = "#00e676"; } 
            else if (combo === 3) { text = "AMAZING!!!"; color = "#00b0ff"; } 
            else if (combo >= 4) { text = "UNBELIEVABLE!!!!"; color = "#d500f9"; }
            comboTextEl.textContent = text; comboTextEl.style.textShadow = `0 0 15px ${color}, 0 0 30px ${color}`;
            comboTextEl.className = ''; void comboTextEl.offsetWidth; comboTextEl.className = 'combo-animate';
        }

        function processPlacement(clientX, clientY) {
            let placed = false; if (!activeBlock) return;
            const slotIndex = parseInt(activeBlock.dataset.slotIndex); const block = rackSlots[slotIndex];

            if (block) {
                const pos = getTargetBoardPos(clientX, clientY, block);
                if (pos) {
                    const { startRow, startCol } = pos;
                    if (canBlockFit(startRow, startCol, block)) {
                        let tileCount = 0;
                        for (let r = 0; r < block.rows; r++) {
                            for (let c = 0; c < block.cols; c++) {
                                if (block.shape[r][c] === 1) {
                                    boardState[startRow + r][startCol + c] = block.color;
                                    tileCount++;
                                }
                            }
                        }
                        addScore(tileCount * 10);
                        rackSlots[slotIndex] = null; placed = true;
                        
                        refreshBoardGraphics(false);
                        checkAndBlast();
                    }
                }
            }

            if (activeBlock) {
                activeBlock.style.position = 'relative'; activeBlock.style.left = '0px'; activeBlock.style.top = '0px'; activeBlock.style.zIndex = '10'; activeBlock = null;
            }
            
            if (placed) {
                if (rackSlots.every(slot => slot === null)) spawnBlocks();
                else { renderRack(); }
            } else { renderRack(); refreshBoardGraphics(false); }
        }

        function addScore(amount) {
            score += amount; currentScoreEl.textContent = score;
            if (score > bestScore) { bestScore = score; bestScoreEl.textContent = bestScore; }
        }

        function checkAndBlast() {
            let rowsToBlast = []; let colsToBlast = [];
            for (let r = 0; r < ROWS; r++) { if (boardState[r].every(cell => cell !== 0)) rowsToBlast.push(r); }
            for (let c = 0; c < COLS; c++) {
                let colFull = true;
                for (let r = 0; r < ROWS; r++) { if (boardState[r][c] === 0) { colFull = false; break; } }
                if (colFull) colsToBlast.push(c);
            }

            if (rowsToBlast.length + colsToBlast.length > 0) {
                comboCount++; addScore((rowsToBlast.length + colsToBlast.length) * 150 * comboCount); showComboReaction(comboCount); 

                setTimeout(() => {
                    rowsToBlast.forEach(r => { for(let c=0; c<COLS; c++) createExplosion(boardEl.children[r*COLS+c], boardState[r][c]); });
                    colsToBlast.forEach(c => { for(let r=0; r<ROWS; r++) { if (boardState[r][c] !== 0 && !rowsToBlast.includes(r)) createExplosion(boardEl.children[r*COLS+c], boardState[r][c]); } });

                    rowsToBlast.forEach(r => boardState[r].fill(0));
                    colsToBlast.forEach(c => { for(let r=0; r<ROWS; r++) boardState[r][c] = 0; });

                    requestAnimationFrame(() => {
                        refreshBoardGraphics(true); 
                        checkGameOver();            
                    });
                }, 150);
            } else {
                comboCount = 0;
                requestAnimationFrame(() => {
                    refreshBoardGraphics(true);
                    checkGameOver(); 
                });
            }
        }
    </script>
</body>
</html>
