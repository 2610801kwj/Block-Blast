            gameLoop();
        }

            for (let i = 0; i < 3; i++) {
                if (inventory[i] === null) {

                    inventory[i] = {
                        shape: SHAPES[randomShapeIdx],
                        colorIdx: colorIdx
                    };
                }
            }
            checkGameOver();
        }

        function updateScore() {
            scoreDisplay.innerText = `SCORE: ${score}`;
        }
