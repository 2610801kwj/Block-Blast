<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>블록 블라스터 마스터피스</title>
    <style>
        body {
            background: #111216; color: #fff; font-family: 'Segoe UI', sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; margin: 0; user-select: none; touch-action: none;
            transition: background 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }
        
        #homeScreen {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #111216; z-index: 6000;
        }
        #homeScreen h1 {
            font-size: 3rem; color: #ffeb3b; margin-bottom: 40px;
            text-shadow: 0 0 20px rgba(255,235,59,0.5);
            animation: pulse 2s infinite alternate;
        }
        .main-btn {
            background: #4caf50; color: #fff; border: none; padding: 16px 45px; 
            font-size: 1.4rem; font-weight: bold; border-radius: 8px; cursor: pointer;
            box-shadow: 0 5px 15px rgba(76,175,80,0.4); transition: 0.2s;
        }
        .main-btn:active { transform: scale(0.95); }

        @keyframes pulse { 0% { transform: scale(1); } 100% { transform: scale(1.05); } }

        .score-container { display: flex; gap: 40px; margin-bottom: 15px; font-size: 1.2rem; font-weight: bold; }
        .score-box { text-align: center; }
        .score-val { color: #ffeb3b; font-size: 1.6rem; text-shadow: 0 0 15px rgba(255,235,59,0.4); }

        #board {
            display: grid; grid-template-columns: repeat(8, 44px); grid-template-rows: repeat(8, 44px); gap: 2px;
            padding: 8px; border: 5px solid #333; border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6); position: relative; 
            transition: background 0.6s, border-color 0.6s;
        }
        .cell { 
            background: #202124; border-radius: 5px; box-sizing: border-box; 
            position: relative; transition: background 0.15s ease, filter 0.15s ease;
        }

        .cell.glow-blast {
            filter: blur(1px) brightness(1.8);
            box-shadow: 0 0 15px currentColor, inset 0 0 8px currentColor;
            z-index: 50;
        }

        .divider { width: 360px; height: 1px; background: rgba(255,255,255,0.1); margin: 25px 0; }
        #rack { display: flex; gap: 25px; justify-content: center; align-items: center; width: 360px; height: 140px; position: relative; }
        
        .block-container { 
            display: grid; gap: 2px; position: relative; touch-action: none; z-index: 10; cursor: grab;
        }
        .block-container:active { cursor: grabbing; }
        .block-container.dragging { transform: scale(1.0) !important; }
        
        .tile { border-radius: 5px; width: 44px; height: 44px; box-sizing: border-box; pointer-events: none; }

        .particle {
            position: fixed; width: 8px; height: 8px; border-radius: 2px;
            pointer-events: none; z-index: 2000; animation: explode 0.5s ease-out forwards;
        }
        @keyframes explode {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
        }

        #comboText {
            position: fixed; font-size: 2.5rem; font-weight: 900; color: #fff;
            text-shadow: 0 0 15px #ff1744, 0 0 30px #ff1744; pointer-events: none;
            z-index: 4000; opacity: 0; transform: scale(0.3); text-align: center;
        }
        .combo-animate { animation: popText 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

        @keyframes popText {
            0% { opacity: 0; transform: scale(0.3) rotate(-5deg); }
            30% { opacity: 1; transform: scale(1.1) rotate(5deg); }
            50% { transform: scale(1) rotate(0deg); }
            80% { opacity: 1; transform: translateY(-30px) scale(1); }
            100% { opacity: 0; transform: translateY(-50px) scale(0.8); }
        }

        #gameOverModal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); z-index: 5000; flex-direction: column; align-items: center; justify-content: center;
        }
        .modal-content {
            background: #22222b; padding: 35px 40px; border-radius: 12px; text-align: center;
            border: 3px solid #ff5722; box-shadow: 0 0 20px rgba(255,87,34,0.4);
        }
        .modal-content h2 { color: #ff5722; margin: 0 0 10px 0; font-size: 2.2rem; }
        .modal-content p { font-size: 1.1rem; margin: 10px 0 25px 0; color: #ccc; }
        .modal-btn-group { display: flex; gap: 15px; justify-content: center; }
        .modal-btn {
            color: #fff; border: none; padding: 12px 24px; font-size: 1.1rem; font-weight: bold;
            border-radius: 6px; cursor: pointer; transition: 0.2s; min-width: 110px;
        }
        .btn-replay { background: #ff5722; }
        .btn-home { background: #555; }
    </style>
</head>
<body>

    <div id="homeScreen">
        <h1>🧱 BLOCK BLAST</h1>
        <button class="main-btn" onclick="startGame()">PLAY GAME</button>
    </div>

    <div id="comboText">GREAT!</div>

    <div class="score-container">
        <div class="score-box">SCORE<br><span id="currentScore" class="score-val">0</span></div>
        <div class="score-box">BEST<br><span id="bestScore" class="score-val">0</span></div>
    </div>
    
    <div id="board"></div>
    <div class="divider"></div>
    <div id="rack"></div>

    <div id="gameOverModal">
        <div class="modal-content">
            <h2>GAME OVER</h2>
            <p>더 이상 블록을 놓을 공간이 없습니다!</p>
            <div class="modal-btn-group">
                <button class="modal-btn btn-replay" onclick="resetGame()">REPLAY</button>
                <button class="modal-btn btn-home" onclick="goHome()">HOME</button>
            </div>
        </div>
    </div>

    <script>
        const boardEl = document.getElementById('board');
        const rackEl = document.getElementById('rack');
        const currentScoreEl = document.getElementById('currentScore');
        const bestScoreEl = document.getElementById('bestScore');
        const gameOverModal = document.getElementById('gameOverModal');
        const homeScreen = document.getElementById('homeScreen');
        const comboTextEl = document.getElementById('comboText');

        const ROWS = 8;
        const COLS = 8;
        let boardState = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
        
        let score = 0;
        let bestScore = 0;
        let activeBlock = null;
        let rackSlots = [null, null, null];
        let comboCount = 0;

        let dragOffsetX = 0;
        let dragOffsetY = 0;

        // 드래그를 시작한 타일이 블록 내에서 몇 번째 행/열인지 저장하는 변수
        let startTileRowOffset = 0;
        let startTileColOffset = 0;

        const themes = [
            { bg: '#111216', border: '#383a40', cell: '#202124' }, 
            { bg: '#060e26', border: '#00d2ff', cell: '#0b1b4f' }, 
            { bg: '#0d2219', border: '#a3e635', cell: '#143829' }  
        ];
        let currentCellColor = '#202124';

        function applyRandomTheme() {
            const randomTheme = themes[Math.floor(Math.random() * themes.length)];
            document.body.style.background = randomTheme.bg;
            boardEl.style.background = randomTheme.bg;
            boardEl.style.borderColor = randomTheme.border;
            currentCellColor = randomTheme.cell;
            
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (boardState[r][c] === 0) {
                        boardEl.children[r * COLS + c].style.backgroundColor = currentCellColor;
                    }
                }
            }
        }

        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.dataset.row = r;
                cell.dataset.col = c;
                boardEl.appendChild(cell);
            }
        }

        const blockPool = [
            { shape: [[1]], color: '#ffeb3b', rows: 1, cols: 1 }, 
            { shape: [[1, 1]], color: '#ff9800', rows: 1, cols: 2 }, 
            { shape: [[1], [1]], color: '#ff9800', rows: 2, cols: 1 }, 
            { shape: [[1, 1, 1]], color: '#e91e63', rows: 1, cols: 3 }, 
            { shape: [[1], [1], [1]], color: '#e91e63', rows: 3, cols: 1 }, 
            { shape: [[1, 1, 1, 1]], color: '#03a9f4', rows: 1, cols: 4 }, 
            { shape: [[1], [1], [1], [1]], color: '#03a9f4', rows: 4, cols: 1 }, 
            { shape: [[1, 1], [1, 1]], color: '#4caf50', rows: 2, cols: 2 }, 
            { shape: [[1, 1, 1], [1, 1, 1], [1, 1, 1]], color: '#9c27b0', rows: 3, cols: 3 }, 
            { shape: [[1, 0], [1, 0], [1, 1]], color: '#3f51b5', rows: 3, cols: 2 }, 
            { shape: [[1, 1, 1], [1, 0, 0]], color: '#3f51b5', rows: 2, cols: 3 }, 
            { shape: [[0, 1], [0, 1], [1, 1]], color: '#00bcd4', rows: 3, cols: 2 }, 
            { shape: [[1, 1], [0, 1], [0, 1]], color: '#00bcd4', rows: 3, cols: 2 }, 
            { shape: [[0, 1, 0], [1, 1, 1]], color: '#ec407a', rows: 2, cols: 3 }, 
            { shape: [[1, 0], [1, 1], [0, 1]], color: '#a3e635', rows: 3, cols: 2 }, 
            { shape: [[0, 1], [1, 1], [1, 0]], color: '#a3e635', rows: 3, cols: 2 }  
        ];

        function startGame() {
            homeScreen.style.display = 'none';
            applyRandomTheme();
            resetGame();
        }

        function goHome() {
            gameOverModal.style.display = 'none';
            homeScreen.style.display = 'flex';
        }

        function spawnBlocks() {
            for (let i = 0; i < 3; i++) {
                const randIndex = Math.floor(Math.random() * blockPool.length);
                rackSlots[i] = blockPool[randIndex];
            }
            renderRack();
            checkGameOver();
        }

        function renderRack() {
            rackEl.innerHTML = '';
            rackSlots.forEach((block, slotIndex) => {
                if (!block) {
                    const emptyBox = document.createElement('div');
                    emptyBox.style.width = '100px';
                    rackEl.appendChild(emptyBox);
                    return;
                }

                const box = document.createElement('div');
                box.className = 'block-container';
                box.style.gridTemplateRows = `repeat(${block.rows}, 44px)`;
                box.style.gridTemplateColumns = `repeat(${block.cols}, 44px)`;
                box.dataset.slotIndex = slotIndex;
                box.style.transform = 'scale(0.7)';
                box.style.transformOrigin = 'center center';

                for (let r = 0; r < block.rows; r++) {
                    for (let c = 0; c < block.cols; c++) {
                        const tile = document.createElement('div');
                        tile.className = 'tile';
                        tile.dataset.tileRow = r;
                        tile.dataset.tileCol = c;
                        if (block.shape[r][c] === 1) {
                            tile.style.backgroundColor = block.color;
                            tile.style.boxShadow = 'inset 0 0 6px rgba(255,255,255,0.3)';
                        } else {
                            tile.style.backgroundColor = 'transparent';
                        }
                        box.appendChild(tile);
                    }
                }

                box.addEventListener('touchstart', handleTouchStart, { passive: false });
                box.addEventListener('touchmove', handleTouchMove, { passive: false });
                box.addEventListener('touchend', handleTouchEnd, { passive: false });
                box.addEventListener('mousedown', handleMouseDown);

                rackEl.appendChild(box);
            });
        }

        function clearPreview() {
            for (let i = 0; i < boardEl.children.length; i++) {
                const cell = boardEl.children[i];
                const r = parseInt(cell.dataset.row);
                const c = parseInt(cell.dataset.col);
                if (boardState[r][c] === 0) {
                    cell.style.backgroundColor = currentCellColor;
                    cell.style.opacity = '1';
                }
                cell.classList.remove('glow-blast');
            }
        }

        // [판정 보정] 손가락/마우스로 가린 셀을 정확하게 추적하도록 바운딩 박스 역산 판정
        function getTargetBoardPos(clientX, clientY, block) {
            const hoveredEl = document.elementFromPoint(clientX, clientY);
            if (!hoveredEl || !hoveredEl.classList.contains('cell')) {
                // 직하방에 셀이 없으면 보드판 전체 영역과의 거리를 계산해 가장 가까운 셀 매칭
                const boardRect = boardEl.getBoundingClientRect();
                if (clientX < boardRect.left || clientX > boardRect.right || clientY < boardRect.top || clientY > boardRect.bottom) {
                    return null;
                }
                const c = Math.floor((clientX - boardRect.left - 8) / 46);
                const r = Math.floor((clientY - boardRect.top - 8) / 46);
                if (r >= 0 && r < ROWS && c >= 0 && c < COLS) {
                    const startRow = r - startTileRowOffset;
                    const startCol = c - startTileColOffset;
                    return { startRow, startCol };
                }
                return null;
            }

            const cellRow = parseInt(hoveredEl.dataset.row);
            const cellCol = parseInt(hoveredEl.dataset.col);

            // 유저가 처음 터치했던 블록 내부 조각 위치(Offset)를 기준으로 기하학적 매칭
            const startRow = cellRow - startTileRowOffset;
            const startCol = cellCol - startTileColOffset;

            return { startRow, startCol };
        }

        function updatePreview(clientX, clientY, slotIndex) {
            clearPreview();
            const block = rackSlots[slotIndex];
            if (!block) return;

            const pos = getTargetBoardPos(clientX, clientY, block);
            if (!pos) return;

            const { startRow, startCol } = pos;

            if (canBlockFit(startRow, startCol, block)) {
                let virtualBoard = boardState.map(row => [...row]);

                for (let r = 0; r < block.rows; r++) {
                    for (let c = 0; c < block.cols; c++) {
                        if (block.shape[r][c] === 1) {
                            const virtualRow = startRow + r;
                            const virtualCol = startCol + c;
                            if (virtualRow >= 0 && virtualRow < ROWS && virtualCol >= 0 && virtualCol < COLS) {
                                const idx = virtualRow * COLS + virtualCol;
                                const cell = boardEl.children[idx];
                                cell.style.backgroundColor = block.color;
                                cell.style.opacity = '0.5'; 
                                virtualBoard[virtualRow][virtualCol] = block.color;
                            }
                        }
                    }
                }

                let predictRows = [];
                let predictCols = [];

                for (let r = 0; r < ROWS; r++) {
                    if (virtualBoard[r].every(cell => cell !== 0)) predictRows.push(r);
                }
                for (let c = 0; c < COLS; c++) {
                    let colFull = true;
                    for (let r = 0; r < ROWS; r++) {
                        if (virtualBoard[r][c] === 0) { colFull = false; break; }
                    }
                    if (colFull) predictCols.push(c);
                }

                predictRows.forEach(r => {
                    for(let c = 0; c < COLS; c++) {
                        const cell = boardEl.children[r * COLS + c];
                        cell.style.color = virtualBoard[r][c] || '#fff';
                        cell.classList.add('glow-blast');
                    }
                });
                predictCols.forEach(c => {
                    for(let r = 0; r < ROWS; r++) {
                        const cell = boardEl.children[r * COLS + c];
                        cell.style.color = virtualBoard[r][c] || '#fff';
                        cell.classList.add('glow-blast');
                    }
                });
            }
        }

        function canBlockFit(startRow, startCol, block) {
            if (startRow < 0 || startCol < 0 || startRow + block.rows > ROWS || startCol + block.cols > COLS) return false;
            for (let r = 0; r < block.rows; r++) {
                for (let c = 0; c < block.cols; c++) {
                    if (block.shape[r][c] === 1 && boardState[startRow + r][startCol + c] !== 0) {
                        return false;
                    }
                }
            }
            return true;
        }

        function checkGameOver() {
            const availableBlocks = rackSlots.filter(b => b !== null);
            if (availableBlocks.length === 0) return;

            for (let block of availableBlocks) {
                for (let r = 0; r < ROWS; r++) {
                    for (let c = 0; c < COLS; c++) {
                        if (canBlockFit(r, c, block)) return;
                    }
                }
            }
            gameOverModal.style.display = 'flex';
        }

        function resetGame() {
            score = 0;
            comboCount = 0;
            currentScoreEl.textContent = '0';
            boardState = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
            clearPreview();
            gameOverModal.style.display = 'none';
            spawnBlocks();
        }

        function handleTouchStart(e) {
            e.preventDefault(); 
            activeBlock = this; 
            activeBlock.classList.add('dragging');
            const touch = e.touches[0];
            const rect = activeBlock.getBoundingClientRect();
            
            // 터치 시작 시 실제 타일 좌표 기준 중앙 오프셋 고정 계산
            dragOffsetX = rect.width / 2;
            dragOffsetY = rect.height / 2;

            // 터치한 타일의 상대적 위치 계산
            const localX = touch.clientX - rect.left;
            const localY = touch.clientY - rect.top;
            const slotIndex = parseInt(activeBlock.dataset.slotIndex);
            const block = rackSlots[slotIndex];
            
            startTileColOffset = Math.floor(localX / (rect.width / block.cols));
            startTileRowOffset = Math.floor(localY / (rect.height / block.rows));

            activeBlock.style.position = 'fixed'; 
            activeBlock.style.zIndex = '1000';
            activeBlock.style.transform = 'scale(1.0)'; 
            activeBlock.style.pointerEvents = 'none';

            moveBlock(touch.clientX, touch.clientY);
            updatePreview(touch.clientX, touch.clientY, activeBlock.dataset.slotIndex);
        }

        function handleTouchMove(e) {
            if (!activeBlock) return; 
            e.preventDefault(); 
            const touch = e.touches[0];
            moveBlock(touch.clientX, touch.clientY); 
            updatePreview(touch.clientX, touch.clientY, activeBlock.dataset.slotIndex);
        }

        function handleTouchEnd(e) {
            if (!activeBlock) return; 
            const touch = e.changedTouches[0];
            
            clearPreview(); 
            activeBlock.classList.remove('dragging');
            activeBlock.style.transform = 'none'; 
            activeBlock.style.pointerEvents = 'auto';
            
            processPlacement(touch.clientX, touch.clientY);
        }

        function handleMouseDown(e) {
            activeBlock = this;
            activeBlock.classList.add('dragging');
            const rect = activeBlock.getBoundingClientRect();
            
            dragOffsetX = rect.width / 2;
            dragOffsetY = rect.height / 2;

            const localX = e.clientX - rect.left;
            const localY = e.clientY - rect.top;
            const slotIndex = parseInt(activeBlock.dataset.slotIndex);
            const block = rackSlots[slotIndex];
            
            startTileColOffset = Math.floor(localX / (rect.width / block.cols));
            startTileRowOffset = Math.floor(localY / (rect.height / block.rows));

            activeBlock.style.position = 'fixed'; 
            activeBlock.style.zIndex = '1000'; 
            activeBlock.style.transform = 'scale(1.0)';
            activeBlock.style.pointerEvents = 'none';
            
            activeBlock.style.left = `${e.clientX - dragOffsetX}px`;
            activeBlock.style.top = `${e.clientY - dragOffsetY}px`;

            const moveHandler = (ev) => {
                if (!activeBlock) return;
                activeBlock.style.left = `${ev.clientX - dragOffsetX}px`;
                activeBlock.style.top = `${ev.clientY - dragOffsetY}px`;
                updatePreview(ev.clientX, ev.clientY, activeBlock.dataset.slotIndex);
            };

            const upHandler = (ev) => {
                window.removeEventListener('mousemove', moveHandler); 
                window.removeEventListener('mouseup', upHandler);
                if (!activeBlock) return;
                clearPreview();
                activeBlock.classList.remove('dragging');
                activeBlock.style.transform = 'none';
                activeBlock.style.pointerEvents = 'auto';
                processPlacement(ev.clientX, ev.clientY); 
            };
            window.addEventListener('mousemove', moveHandler); 
            window.addEventListener('mouseup', upHandler);
        }

        function moveBlock(clientX, clientY) {
            if (!activeBlock) return;
            activeBlock.style.left = `${clientX - dragOffsetX}px`; 
            activeBlock.style.top = `${clientY - dragOffsetY}px`;
        }

        function createExplosion(cellEl, color) {
            const rect = cellEl.getBoundingClientRect();
            for (let i = 0; i < 6; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle'; 
                particle.style.backgroundColor = color;
                particle.style.left = `${rect.left + rect.width / 2}px`; 
                particle.style.top = `${rect.top + rect.height / 2}px`;
                
                const angle = Math.random() * Math.PI * 2; 
                const distance = Math.random() * 50 + 30;
                
                particle.style.setProperty('--dx', `${Math.cos(angle) * distance}px`);
                particle.style.setProperty('--dy', `${Math.sin(angle) * distance}px`);
                document.body.appendChild(particle); 
                
                setTimeout(() => { particle.remove(); }, 500);
            }
        }

        function showComboReaction(combo) {
            let text = "GREAT!";
            let color = "#ffeb3b"; 
            if (combo === 2) { text = "EXCELLENT!!"; color = "#00e676"; } 
            else if (combo === 3) { text = "AMAZING!!!"; color = "#00b0ff"; } 
            else if (combo >= 4) { text = "UNBELIEVABLE!!!!"; color = "#d500f9"; }

            comboTextEl.textContent = text;
            comboTextEl.style.textShadow = `0 0 15px ${color}, 0 0 30px ${color}`;
            comboTextEl.className = ''; 
            void comboTextEl.offsetWidth; 
            comboTextEl.className = 'combo-animate';
        }

        async function playAllClearAnimation() {
            const colors = ['#e91e63', '#00bcd4', '#ffeb3b', '#4caf50', '#ff9800', '#9c27b0', '#03a9f4', '#3f51b5'];
            
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const cell = boardEl.children[r * COLS + c];
                    cell.style.backgroundColor = colors[r];
                    cell.style.color = colors[r];
                    cell.classList.add('glow-blast');
                }
                await new Promise(resolve => setTimeout(resolve, 50));
            }
            await new Promise(resolve => setTimeout(resolve, 150));

            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    createExplosion(boardEl.children[r * COLS + c], colors[r]);
                }
            }

            boardState = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
            applyRandomTheme(); 
            clearPreview();
            
            addScore(1000); 
            showComboReaction(4); 
        }

        function processPlacement(clientX, clientY) {
            let placed = false;
            if (!activeBlock) return;
            const slotIndex = parseInt(activeBlock.dataset.slotIndex);
            const block = rackSlots[slotIndex];

            if (block) {
                const pos = getTargetBoardPos(clientX, clientY, block);
                
                if (pos) {
                    const { startRow, startCol } = pos;

                    if (canBlockFit(startRow, startCol, block)) {
                        let tileCount = 0;
                        for (let r = 0; r < block.rows; r++) {
                            for (let c = 0; c < block.cols; c++) {
                                if (block.shape[r][c] === 1) {
                                    boardState[startRow + r][startCol + c] = block.color;
                                    const targetCell = boardEl.children[(startRow + r) * COLS + (startCol + c)];
                                    targetCell.style.backgroundColor = block.color;
                                    tileCount++;
                                }
                            }
                        }
                        
                        addScore(tileCount * 10);
                        checkAndBlast();
                        
                        rackSlots[slotIndex] = null;
                        placed = true;
                    }
                }
            }

            activeBlock.style.position = 'relative'; 
            activeBlock.style.left = '0px'; 
            activeBlock.style.top = '0px'; 
            activeBlock.style.zIndex = '10'; 
            activeBlock = null;

            if (placed) {
                if (rackSlots.every(slot => slot === null)) {
                    spawnBlocks();
                } else {
                    renderRack();
                    checkGameOver();
                }
            } else {
                renderRack();
            }
        }

        function addScore(amount) {
            score += amount; 
            currentScoreEl.textContent = score;
            if (score > bestScore) { 
                bestScore = score; 
                bestScoreEl.textContent = bestScore; 
            }
        }

        function checkAndBlast() {
            let rowsToBlast = [];
            let colsToBlast = [];

            for (let r = 0; r < ROWS; r++) {
                if (boardState[r].every(cell => cell !== 0)) rowsToBlast.push(r);
            }
            for (let c = 0; c < COLS; c++) {
                let colFull = true;
                for (let r = 0; r < ROWS; r++) {
                    if (boardState[r][c] === 0) { colFull = false; break; }
                }
                if (colFull) colsToBlast.push(c);
            }

            const linesBlasted = rowsToBlast.length + colsToBlast.length;
            
            if (linesBlasted > 0) {
                comboCount++; 
                addScore(linesBlasted * 150 * comboCount); 
                showComboReaction(comboCount); 

                rowsToBlast.forEach(r => {
                    for(let c = 0; c < COLS; c++) {
                        const cell = boardEl.children[r * COLS + c];
                        cell.style.color = boardState[r][c];
                        cell.classList.add('glow-blast');
                    }
                });
                colsToBlast.forEach(c => {
                    for(let r = 0; r < ROWS; r++) {
                        const cell = boardEl.children[r * COLS + c];
                        cell.style.color = boardState[r][c];
                        cell.classList.add('glow-blast');
                    }
                });

                setTimeout(() => {
                    rowsToBlast.forEach(r => {
                        for(let c = 0; c < COLS; c++) {
                            createExplosion(boardEl.children[r * COLS + c], boardState[r][c]);
                        }
                    });
                    colsToBlast.forEach(c => {
                        for (let r = 0; r < ROWS; r++) {
                            if (boardState[r][c] !== 0 && !rowsToBlast.includes(r)) {
                                createExplosion(boardEl.children[r * COLS + c], boardState[r][c]);
                            }
                        }
                    });

                    rowsToBlast.forEach(r => {
                        boardState[r].fill(0);
                        for(let c = 0; c < COLS; c++) {
                            const cell = boardEl.children[r * COLS + c];
                            cell.style.backgroundColor = currentCellColor;
                            cell.classList.remove('glow-blast');
                        }
                    });
                    colsToBlast.forEach(c => {
                        for (let r = 0; r < ROWS; r++) {
                            boardState[r][c] = 0;
                            const cell = boardEl.children[r * COLS + c];
                            cell.style.backgroundColor = currentCellColor;
                            cell.classList.remove('glow-blast');
                        }
                    });

                    let isAllClear = true;
                    for (let r = 0; r < ROWS; r++) {
                        for (let c = 0; c < COLS; c++) {
                            if (boardState[r][c] !== 0) { isAllClear = false; break; }
                        }
                    }
                    if (isAllClear) playAllClearAnimation(); 

                }, 200);

            } else {
                comboCount = 0; 
            }
        }
    </script>
</body>
</html>
