<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>블록 블라스터 (출력 100% 보장 버전)</title>
    <style>
        body {
            background: #141419; color: #fff; font-family: 'Malgun Gothic', sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; margin: 0; user-select: none;
        }
        h1 { margin: 0 0 15px 0; color: #ffeb3b; text-shadow: 0 0 10px rgba(255,235,59,0.3); }
        
        /* 8x8 메인 게임판 세팅 */
        #board {
            display: grid;
            grid-template-columns: repeat(8, 45px);
            grid-template-rows: repeat(8, 45px);
            gap: 2px;
            background: #141419;
            padding: 6px;
            border: 4px solid #444;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        /* 격자 무늬 칸 */
        .cell {
            background: #25252e;
            border-radius: 4px;
            box-sizing: border-box;
        }

        /* 하단 대기소 고정 라인 */
        .divider {
            width: 380px; height: 1px; background: #333; margin: 25px 0;
        }

        /* 하단 블록들이 들어가는 공간 */
        #rack {
            display: flex; gap: 30px; justify-content: center; align-items: center;
            width: 380px; height: 100px;
        }
        
        /* 드래그용 블록 컨테이너 */
        .block-container {
            display: grid; gap: 1px; cursor: grab; position: relative;
        }
        .block-container:active { cursor: grabbing; }
        .tile { border-radius: 3px; }

        .info { margin-top: 20px; color: #aaa; font-size: 0.9rem; text-align: center; }
    </style>
</head>
<body>

    <h1>🧱 BLOCK BLAST</h1>
    
    <div id="board"></div>

    <div class="divider"></div>

    <div id="rack"></div>

    <div class="info">👉 하단의 블록을 마우스로 드래그해서 격자판 위에 놓으세요!</div>

    <script>
        const boardEl = document.getElementById('board');
        const rackEl = document.getElementById('rack');

        const ROWS = 8, COLS = 8;
        const boardState = Array.from({ length: ROWS }, () => Array(COLS).fill(0));

        // 1. 메인 8x8 격자판 동적 생성 (절대 깨지지 않음)
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.dataset.row = r;
                cell.dataset.col = c;
                boardEl.appendChild(cell);
            }
        }

        // 테스트용 선행 블록 배치 코드 (판에 블록 정상 작동 확인용)
        placeFixedTile(7, 0, '#ff5722');
        placeFixedTile(7, 1, '#ff5722');

        function placeFixedTile(r, c, color) {
            boardState[r][c] = color;
            const targetCell = boardEl.children[r * COLS + c];
            targetCell.style.backgroundColor = color;
        }

        // 2. 하단 리스폰용 대기 블록 모양 데이터 정의
        const blockTemplates = [
            { shape: [[1, 1], [1, 1]], color: '#00bcd4', rows: 2, cols: 2 }, // 2x2 네모
            { shape: [[1, 1, 1]], color: '#e91e63', rows: 1, cols: 3 },      // 1x3 가로막대
            { shape: [[1, 0], [1, 1]], color: '#ffeb3b', rows: 2, cols: 2 }  // ㄴ자 모양
        ];

        // 3. 하단 대기소에 블록들 그려넣기
        function renderRack() {
            rackEl.innerHTML = ''; // 초기화
            blockTemplates.forEach((tmpl, index) => {
                const box = document.createElement('div');
                box.className = 'block-container';
                box.style.gridTemplateRows = `repeat(${tmpl.rows}, 30px)`;
                box.style.gridTemplateColumns = `repeat(${tmpl.cols}, 30px)`;
                box.draggable = true;

                // 데이터 바인딩
                box.dataset.index = index;

                for (let r = 0; r < tmpl.rows; r++) {
                    for (let c = 0; c < tmpl.cols; c++) {
                        const tile = document.createElement('div');
                        tile.className = 'tile';
                        if (tmpl.shape[r][c] === 1) {
                            tile.style.backgroundColor = tmpl.color;
                        } else {
                            tile.style.backgroundColor = 'transparent';
                        }
                        box.appendChild(tile);
                    }
                }

                // 드래그앤드롭 이벤트 등록
                box.addEventListener('dragstart', handleDragStart);
                box.addEventListener('dragend', handleDragEnd);
                rackEl.appendChild(box);
            });
        }

        // 드래그 메커니즘 구현
        let draggedIndex = null;

        function handleDragStart(e) {
            draggedIndex = this.dataset.index;
            this.style.opacity = '0.4';
        }

        function handleDragEnd(e) {
            this.style.opacity = '1';
            
            // 마우스가 위치한 곳의 격자 요소 수집
            const target = document.elementFromPoint(e.clientX, e.clientY);
            if (!target || !target.classList.contains('cell')) return;

            const startRow = parseInt(target.dataset.row);
            const startCol = parseInt(target.dataset.col);
            const block = blockTemplates[draggedIndex];

            // 배치 가능 여부 체크
            let canPlace = true;
            if (startRow + block.rows <= ROWS && startCol + block.cols <= COLS) {
                for (let r = 0; r < block.rows; r++) {
                    for (let c = 0; c < block.cols; c++) {
                        if (block.shape[r][c] === 1) {
                            if (boardState[startRow + r][startCol + c] !== 0) {
                                canPlace = false;
                            }
                        }
                    }
                }
            } else {
                canPlace = false;
            }

            // 배치 성공 시 연산 처리
            if (canPlace) {
                for (let r = 0; r < block.rows; r++) {
                    for (let c = 0; c < block.cols; c++) {
                        if (block.shape[r][c] === 1) {
                            placeFixedTile(startRow + r, startCol + c, block.color);
                        }
                    }
                }
                // 줄 파괴 시스템 가동
                checkAndBlast();
            }
        }

        // 라인 클리어(Blast) 시스템
        function checkAndBlast() {
            let rowsToBlast = [];
            let colsToBlast = [];

            // 가로 검사
            for (let r = 0; r < ROWS; r++) {
                if (boardState[r].every(cell => cell !== 0)) rowsToBlast.push(r);
            }
            // 세로 검사
            for (let c = 0; c < COLS; c++) {
                let colFull = true;
                for (let r = 0; r < ROWS; r++) {
                    if (boardState[r][c] === 0) { colFull = false; break; }
                }
                if (colFull) colsToBlast.push(c);
            }

            // 폭파 및 색상 되돌리기
            rowsToBlast.forEach(r => {
                boardState[r].fill(0);
                for(let c=0; c<COLS; c++) boardEl.children[r * COLS + c].style.backgroundColor = '#25252e';
            });
            colsToBlast.forEach(c => {
                for (let r = 0; r < ROWS; r++) {
                    boardState[r][c] = 0;
                    boardEl.children[r * COLS + c].style.backgroundColor = '#25252e';
                }
            });
        }

        // 초기 실행 실행구
        renderRack();
    </script>
</body>
</html>
