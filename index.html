<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>블록 블라스터 (격자판 + 블록 정상 출력)</title>
    <style>
        body {
            background: #121216; color: #fff; font-family: 'Malgun Gothic', sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; margin: 0; user-select: none;
        }
        h1 { margin: 0 0 10px 0; color: #4caf50; text-shadow: 0 0 10px rgba(76,175,80,0.3); }
        .game-container { display: flex; flex-direction: column; align-items: center; gap: 20px; }
        canvas { background: #1e1e24; border: 4px solid #333; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.7); }
        .info { color: #aaa; font-size: 0.9rem; text-align: center; }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>🧱 BLOCK BLAST</h1>
        <canvas id="blockCanvas" width="400" height="550"></canvas>
        <div class="info">👉 하단의 블록을 마우스로 드래그해서 격자판 위에 놓으세요!</div>
    </div>

    <script>
        const canvas = document.getElementById('blockCanvas');
        const ctx = canvas.getContext('2d');

        // 설정 데이터
        const COLS = 8;        // 가로 8칸
        const ROWS = 8;        // 세로 8칸
        const BLOCK_SIZE = 45; // 한 칸의 크기 (픽셀)
        const BOARD_X = 20;    // 판의 시작 X 좌표
        const BOARD_Y = 20;    // 판의 시작 Y 좌표

        // 1. 게임 판(그리드 상태) 초기화 (0은 빈칸, 색상 코드가 들어가면 채워진 칸)
        let board = Array.from({ length: ROWS }, () => Array(COLS).fill(0));

        // 테스트용으로 판에 블록 몇 개 미리 채워두기 (정상 출력 확인용)
        board[7][0] = '#ff5722';
        board[7][1] = '#ff5722';
        board[6][1] = '#ff5722';

        // 2. 하단에 등장할 드래그용 블록 데이터 (정상 출력을 위해 구조 명확히 세팅)
        // 블록 모양 배열과 화면상 그려질 실시간 x, y 좌표
        let standbyBlocks = [
            {
                shape: [
                    [1, 1],
                    [1, 1]
                ],
                color: '#00bcd4',
                x: 40, y: 420, originalX: 40, originalY: 420,
                w: 2 * BLOCK_SIZE, h: 2 * BLOCK_SIZE
            },
            {
                shape: [
                    [1, 1, 1]
                ],
                color: '#e91e63',
                x: 180, y: 440, originalX: 180, originalY: 440,
                w: 3 * BLOCK_SIZE, h: 1 * BLOCK_SIZE
            },
            {
                shape: [
                    [1, 0],
                    [1, 1]
                ],
                color: '#ffeb3b',
                x: 310, y: 420, originalX: 310, originalY: 420,
                w: 2 * BLOCK_SIZE, h: 2 * BLOCK_SIZE
            }
        ];

        let draggedBlock = null;
        let offsetX = 0;
        let offsetY = 0;

        // --- 그리기 함수 (렌더러) ---
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // [해결책] 놓는 판 배경 및 선명한 격자 필터 그리기
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    let x = BOARD_X + c * BLOCK_SIZE;
                    let y = BOARD_Y + r * BLOCK_SIZE;

                    // 기본 칸 배경색 (어두운 회색)
                    ctx.fillStyle = '#2d2d3a';
                    ctx.fillRect(x, y, BLOCK_SIZE - 2, BLOCK_SIZE - 2);

                    // 격자 테두리 선 선명하게 그리기
                    ctx.strokeStyle = '#141419';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(x, y, BLOCK_SIZE, BLOCK_SIZE);

                    // 판 위에 이미 안착된 블록이 있다면 그리기
                    if (board[r][c] !== 0) {
                        ctx.fillStyle = board[r][c];
                        // 입체감을 위해 라운드 처리나 약간 축소해서 채우기
                        ctx.fillRect(x + 1, y + 1, BLOCK_SIZE - 4, BLOCK_SIZE - 4);
                    }
                }
            }

            // 하단 대기실 가이드선
            ctx.strokeStyle = '#333';
            ctx.beginPath();
            ctx.moveTo(0, 390);
            ctx.lineTo(canvas.width, 390);
            ctx.stroke();
